<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Portofolio Pro</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; padding: 20px 15px 100px 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-size: 20px; font-weight: bold; color: var(--accent); }
        .kurs-info { font-size: 10px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .summary-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--accent); text-align: center; }
        .summary-idr { font-size: 26px; font-weight: 800; display: block; }
        
        /* Filter & Sort Box */
        .filter-section { display: flex; gap: 8px; margin-bottom: 15px; align-items: center; }
        .filter-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 12px; padding: 10px 15px; color: white; outline: none; font-size: 13px; }
        .sort-select { background: var(--card); color: white; border: 1px solid #334155; border-radius: 10px; font-size: 11px; padding: 10px 5px; outline: none; cursor: pointer; }

        .coin-row { position: relative; margin-bottom: 10px; }
        .coin-card { background: var(--card); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #334155; cursor: pointer; position: relative; z-index: 2; }
        .logo-wrapper { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid #475569; flex-shrink: 0; background: #000; display: flex; align-items: center; justify-content: center; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .info-group { flex: 1; min-width: 0; }
        .symbol { font-size: 15px; font-weight: bold; }
        .change-pct { font-size: 10px; font-weight: bold; margin-left: 5px; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .delete-coin { position: absolute; right: -25px; top: 50%; transform: translateY(-50%); color: var(--down); font-size: 20px; cursor: pointer; padding: 10px; }
        .details { background: #161e2e; margin: -10px 5px 10px 5px; padding: 20px 15px 15px 15px; border-radius: 0 0 12px 12px; border: 1px solid #334155; display: none; }
        .source-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .source-label { font-size: 12px; color: var(--subtext); flex: 1; }
        .source-input { width: 100px; background: #000; border: 1px solid #475569; color: #fff; text-align: right; border-radius: 6px; padding: 4px; font-size: 13px; }
        .del-src { color: var(--down); font-size: 18px; cursor: pointer; margin-left: 8px; }
        .add-source-box { display: flex; gap: 5px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #334155; }
        .add-source-box input { flex: 1; background: transparent; border: 1px dashed #475569; color: white; padding: 5px; border-radius: 6px; font-size: 11px; outline: none; }
        
        .add-section { margin-top: 40px; padding-top: 20px; border-top: 1px dashed #334155; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-box input { flex: 1; background: var(--card); border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; outline: none; }
        .add-btn { background: var(--accent); border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .backup-section { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .backup-btn { background: transparent; border: 1px solid #334155; color: var(--subtext); padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center; }
        .last-updated { text-align: center; font-size: 10px; color: var(--subtext); margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="brand">PORTOFOLIO</div>
        <div id="kurs-live" class="kurs-info">USD/IDR: 16.000</div>
    </div>
    
    <div class="summary-card">
        <span style="font-size: 11px; color: var(--accent); letter-spacing: 1px;">TOTAL SALDO</span>
        <span id="total-all-idr" class="summary-idr">Rp 0</span>
        <span id="total-all-usd" style="color: var(--subtext); font-size: 14px;">$0.00</span>
    </div>

        <select id="sort-order" class="sort-
