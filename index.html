<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURS REALTIME - BYBIT ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #0b0e11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-card { background: #1e2329; border: 1px solid #30363d; border-radius: 20px; }
        .input-box { background: #2b3139; border: 1px solid #474d57; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #f0b90b; }
        .text-yellow { color: #f0b90b; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 flex flex-col items-center">

    <div class="w-full max-w-4xl">
        <!-- Header -->
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-white">
                KURS<span class="text-yellow">REALTIME</span>
            </h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-[0.4em] mt-1">Powered by Bybit API Data</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Kolom Kiri: Kalkulator Kurs -->
            <div class="lg:col-span-1">
                <div class="glass-card p-6 shadow-2xl border-t-4 border-t-yellow-500">
                    <h2 class="text-xs font-bold text-gray-500 mb-6 uppercase">Converter</h2>
                    
                    <div class="mb-6">
                        <label class="text-[10px] text-gray-400 block mb-2 font-bold">JUMLAH USD</label>
                        <input type="number" id="usdValue" value="1" 
                            class="input-box w-full p-4 text-3xl font-bold rounded-xl text-white">
                    </div>

                    <div class="bg-[#2b3139] rounded-xl p-5 border border-gray-700">
                        <p class="text-[10px] text-yellow font-bold mb-1 uppercase">Estimasi Rupiah (IDR)</p>
                        <div id="idrResult" class="text-2xl font-black text-white">Rp 0</div>
                        <div id="liveRate" class="text-[10px] text-gray-500 mt-3 font-mono">Rate: Fetching...</div>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Multi Coin Market -->
            <div class="lg:col-span-2">
                <div class="glass-card p-6 shadow-2xl border-t-4 border-t-blue-500">
                    <h2 class="text-xs font-bold text-gray-500 mb-6 uppercase">Market Monitor (Live)</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="coinGrid">
                        <!-- Coin list generated by JS -->
                    </div>
                    <div id="updateTime" class="text-[9px] text-gray-600 mt-6 text-center italic uppercase">Syncing...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT'];
        const grid = document.getElementById('coinGrid');

        // Bikin Box Koin
        symbols.forEach(s => {
            grid.innerHTML += `
                <div class="bg-[#2b3139] p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-400 font-bold">${s.replace('USDT', '')}</p>
                        <p id="p-${s}" class="text-xl font-bold text-white">$ --</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 font-bold uppercase">24H High</p>
                        <p id="h-${s}" class="text-[10px] font-mono text-gray-300">--</p>
                    </div>
                </div>
            `;
        });

        // Ambil data pake engine Bybit (Persis Porto elu)
        async function fetchBybit() {
            try {
                // 1. Ambil Kurs USDTIDR buat konverter
                const resKurs = await fetch('https://api.bybit.com/v5/market/tickers?category=spot&symbol=USDTIDR');
                const dataKurs = await resKurs.json();
                const rate = parseFloat(dataKurs.result.list[0].lastPrice);

                const usdInput = document.getElementById('usdValue').value;
                const totalIdr = usdInput * rate;

                document.getElementById('idrResult').innerText = new Intl.NumberFormat('id-IDR', {
                    style: 'currency', currency: 'IDR', maximumFractionDigits: 0
                }).format(totalIdr);

                document.getElementById('liveRate').innerText = `Rate: Rp ${rate.toLocaleString('id-IDR')} (Bybit)`;

                // 2. Ambil Harga Koin Lain
                for (const s of symbols) {
                    const resCoin = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${s}`);
                    const dataCoin = await resCoin.json();
                    const d = dataCoin.result.list[0];

                    document.getElementById(`p-${s}`).innerText = '$ ' + parseFloat(d.lastPrice).toLocaleString();
                    document.getElementById(`h-${s}`).innerText = parseFloat(d.highPrice24h).toLocaleString();
                }

                document.getElementById('updateTime').innerText = "Last Update: " + new Date().toLocaleTimeString();

            } catch (error) {
                console.error("Gagal ambil data Bybit:", error);
                document.getElementById('updateTime').innerText = "Connection Error!";
            }
        }

        // Listener & Auto Run
        document.getElementById('usdValue').addEventListener('input', fetchBybit);
        fetchBybit();
        setInterval(fetchBybit, 5000); // Update tiap 5 detik
    </script>
</body>
</html>
