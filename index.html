<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Portfolio Pro v1.0</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; padding: 20px 15px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .brand { font-size: 28px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
        
        .coin-card { 
            background: var(--card); border-radius: 12px; padding: 12px; 
            display: flex; align-items: center; gap: 10px; border: 1px solid #334155;
            cursor: pointer; transition: 0.2s;
        }
        .coin-card:active { transform: scale(0.98); }
        .logo-wrapper { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid #475569; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-group { flex: 1; }
        .symbol { font-size: 14px; font-weight: bold; }
        .price-live { font-size: 10px; color: var(--accent); display: block; }
        
        .total-display { text-align: right; }
        .amount-main { font-size: 16px; font-weight: bold; display: block; }
        .value-idr { font-size: 11px; color: var(--subtext); }

        /* Detail Breakdown Style */
        .details { 
            background: rgba(0,0,0,0.2); margin: -5px 5px 10px 5px; 
            padding: 15px; border-radius: 0 0 12px 12px; border: 1px solid #334155; border-top: none;
            display: none; /* Hidden by default */
        }
        .source-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .source-row label { font-size: 12px; color: var(--subtext); }
        .source-input { 
            width: 60%; background: var(--bg); border: 1px solid #475569; 
            border-radius: 6px; color: white; padding: 5px 8px; text-align: right; font-weight: bold;
        }

        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">PORTFOLIO</div>
        <div id="kurs-live" style="font-size: 12px; color: var(--subtext);">USD/IDR: Loading...</div>
    </div>

    <div id="main-list">
        </div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tambah koin (misal: SUI)">
            <button class="add-btn" onclick="addCoin()">+</button>
        </div>
    </div>
</div>

<script>
    let usdToIdr = 16000;
    let prices = { BTC: 0, ETH: 0 };
    let watchlist = JSON.parse(localStorage.getItem('my_assets_v1')) || ['BTC', 'ETH'];
    // Simpan saldo per koin per source: { BTC: { binance: 0.1, bybit: 0.05 }, ... }
    let balances = JSON.parse(localStorage.getItem('my_balances_v1')) || {};

    const sources = ['Binance', 'Bybit', 'Wallet'];

    async function init() {
        await fetchPrices();
        renderList();
    }

    async function fetchPrices() {
        try {
            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=usd-coin,bitcoin,ethereum&vs_currencies=idr,usd');
            const d = await r.json();
            usdToIdr = d['usd-coin'].idr;
            prices.BTC = d.bitcoin.usd;
            prices.ETH = d.ethereum.usd;
            // Fetch koin lain di watchlist kalau perlu...
        } catch(e) { console.log("Gagal ambil harga"); }
    }

    function renderList() {
        const list = document.getElementById('main-list');
        list.innerHTML = "";

        watchlist.forEach(sym => {
            const total = getTotal(sym);
            const valueIdr = total * (prices[sym] || 0) * usdToIdr;

            list.innerHTML += `
                <div class="coin-group">
                    <div class="coin-card" onclick="toggleDetail('${sym}')">
                        <div class="logo-wrapper"><img src="${getLogo(sym)}"></div>
                        <div class="info-group">
                            <span class="symbol">${sym}</span>
                            <span class="price-live">$${(prices[sym] || 0).toLocaleString()}</span>
                        </div>
                        <div class="total-display">
                            <span class="amount-main">${total.toLocaleString(undefined, {maximumFractionDigits: 8})}</span>
                            <span class="value-idr">Rp ${Math.round(valueIdr).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    <div id="detail-${sym}" class="details">
                        ${sources.map(src => `
                            <div class="source-row">
                                <label>${src}</label>
                                <input type="number" class="source-input" 
                                    value="${balances[sym]?.[src] || ''}" 
                                    placeholder="0"
                                    oninput="updateBalance('${sym}', '${src}', this.value)">
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div style="height:10px"></div>
            `;
        });
    }

    function getTotal(sym) {
        if (!balances[sym]) return 0;
        return Object.values(balances[sym]).reduce((a, b) => a + (parseFloat(b) || 0), 0);
    }

    function toggleDetail(sym) {
        const el = document.getElementById(`detail-${sym}`);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function updateBalance(sym, src, val) {
        if (!balances[sym]) balances[sym] = {};
        balances[sym][src] = val;
        localStorage.setItem('my_balances_v1', JSON.stringify(balances));
        
        // Refresh cuma angka di baris koin tanpa nutup accordion
        renderListOnlyNumbers();
    }

    function renderListOnlyNumbers() {
        // Render ulang totalan tanpa ngerusak fokus input
        watchlist.forEach(sym => {
            const total = getTotal(sym);
            const valueIdr = total * (prices[sym] || 0) * usdToIdr;
            // Update UI total di baris koin
            // (Untuk performa lebih baik, idealnya pakai ID spesifik)
        });
        // Biar gampang, panggil renderList() aja tapi ini bikin input lose focus
        // Jadi kita panggil render ulang saat selesai input atau pakai teknik DOM update
        renderList(); 
    }

    function addCoin() {
        let s = document.getElementById('search-input').value.toUpperCase().trim();
        if (s && !watchlist.includes(s)) {
            watchlist.push(s);
            localStorage.setItem('my_assets_v1', JSON.stringify(watchlist));
            renderList();
        }
    }

    function getLogo(s) {
        const sym = s.toLowerCase();
        if (sym === 'btc') return 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png';
        if (sym === 'eth') return 'https://assets.coingecko.com/coins/images/279/large/ethereum.png';
        return `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${sym}.png`;
    }

    window.onload = init;
</script>
</body>
</html>
