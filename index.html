              <div class="item-val-main" style="font-size:12px">${getCoinTotal(s).toLocaleString()}</div>
              <div class="item-val-sub" id="val-coin-${s}">-</div>
            </div>
          </div>
          <div class="item-detail${isOpen?' open':''}" id="det-${s}">
            <div class="detail-inner">
              ${srcRows}
              <div class="new-src-box">
                <button class="new-src-btn" style="flex:1;padding:9px 14px;font-size:13px;font-family:var(--sans);font-weight:600" onclick="openExSearch('${s}')">+ Tambah ke Exchange</button>
              </div>
            </div>
          </div>
        </div>`;
    });
  }

  list.innerHTML = html;
  if (!isGhost && typeof invalidateGhost === 'function') invalidateGhost();
  if (isGhost) list.querySelectorAll('.item-wrap').forEach(el => el.classList.add('instant'));
  else revealItems(list);
  updatePricesOnly();

  // Disable scroll-wheel on all number inputs
  list.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  });
}

// ══════════════════════════════
//  ACTIONS
// ══════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  ['tab-ex','tab-ex-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='exchange'); });
  ['tab-coin','tab-coin-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='coin'); });
  expandedItem = null;
  revealedIds.clear();
  const label = tab === 'exchange' ? '+ Tambah Exchange' : '+ Tambah Coin';
  ['global-add-btn-desk','global-add-btn-mob'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = label; });
  renderList();
}

function updateSettings(src) {
  if(src === 'mob') {
    const sortVal = document.getElementById('sort-order')?.value;
    const curVal = document.getElementById('currency-view')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order-desk'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view-desk'); if(d) d.value = curVal; }
  } else {
    const sortVal = document.getElementById('sort-order-desk')?.value;
    const curVal = document.getElementById('currency-view-desk')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view'); if(d) d.value = curVal; }
  }
  renderList();
}

function handleGlobalAdd() {
  if (currentTab === 'coin') {
    openCoinSearch('global');
    return;
  }
  const overlay = document.getElementById('modal-overlay');
  const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = '+ TAMBAH EXCHANGE';
  inp.style.display = 'block';
  inp.type = 'text';
  inp.value = '';
  inp.placeholder = 'Nama Exchange...';
  inp.style.textTransform = 'uppercase';
  document.getElementById('modal-btns').innerHTML = `
    <button class="modal-btn mb-ok" id="btn-addex-ok">TAMBAH</button>
    <button class="modal-btn mb-cancel" onclick="closeModal();document.getElementById('modal-input').style.textTransform=''">BATAL</button>`;
  document.getElementById('btn-addex-ok').onclick = () => {
    const v = inp.value.trim().toUpperCase();
    inp.style.textTransform = '';
    if (!v) return;
    closeModal();
    if (!allExchanges.includes(v)) { allExchanges.push(v); saveAll(); renderList(); showToast(`${v} ditambahkan`, 'success'); }
    else showToast(`Exchange ${v} sudah ada!`);
  };
  overlay.classList.add('active');
  setTimeout(() => inp.focus(), 200);
}

function updateBal(s, src, type, v) {
  if(!balances[s]) balances[s] = {};
  if(!balances[s][src] || typeof balances[s][src] !== 'object') balances[s][src] = { amount: 0, staking: '' };
  balances[s][src][type] = v;
  saveAll();
  updatePricesOnly();
}

function addCoinToExchange(ex) {
  const input = document.getElementById(`add-coin-to-${ex}`);
  const s = input.value.toUpperCase().trim();
  if(s) {
    if(!watchlist.includes(s)) { watchlist.push(s); coinSources[s] = []; }
    if(!coinSources[s].includes(ex)) { coinSources[s].push(ex); saveAll(); input.value = ''; renderList(); fetchAll(); showToast(`${s} ditambahkan`, 'success'); }
    else showToast('Koin sudah ada!');
  }
}

function addCustomSource(s) {
  const input = document.getElementById(`new-src-input-${s}`);
  const v = input.value.trim().toUpperCase();
  if(v) {
    if(!coinSources[s].includes(v)) {
      coinSources[s].push(v);
      if(!allExchanges.includes(v)) allExchanges.push(v);
      saveAll(); renderList();
    } else showToast('Source sudah ada!');
  }
}

function removeCoinFromExchange(s, ex) { coinSources[s] = coinSources[s].filter(i => i !== ex); saveAll(); renderList(); showToast(`${s} dihapus`, 'error'); }
function removeSource(s, src) { coinSources[s] = coinSources[s].filter(i => i !== src); saveAll(); renderList(); showToast(`${src} dihapus`, 'error'); }

function resetApp() {
  localStorage.clear(); watchlist = []; balances = {}; coinSources = {}; allExchanges = []; prices = {}; changes = {};
  expandedItem = null; renderList(); updatePricesOnly(); showToast('Data direset!');
}

function openFilePicker(mode) { currentMode = mode; document.getElementById('importFile').value = ''; document.getElementById('importFile').click(); }

function exportData(fileName) {
  const data = { assets: watchlist, balances: balances, sources: coinSources, exchanges: allExchanges };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `${fileName.toUpperCase().trim()}.json`;
  a.click();
}

function handleFileSelect(event) {
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (f) => {
    try {
      let d = JSON.parse(f.target.result);
      if(currentMode === 'restore') {
        watchlist = d.assets || []; balances = d.balances || {}; coinSources = d.sources || {}; allExchanges = d.exchanges || [];
      } else {
        (d.assets || []).forEach(s => { if(!watchlist.includes(s)) watchlist.push(s); });
        (d.exchanges || []).forEach(ex => { if(!allExchanges.includes(ex)) allExchanges.push(ex); });
        for(let s in d.sources) { if(!coinSources[s]) coinSources[s]=[]; d.sources[s].forEach(src => { if(!coinSources[s].includes(src)) coinSources[s].push(src); }); }
        for(let s in d.balances) { if(!balances[s]) balances[s]={}; for(let src in d.balances[s]) { balances[s][src] = d.balances[s][src]; } }
      }
      migrateToUppercase(); saveAll(); fetchKurs(); renderList(); updatePricesOnly(); fetchAll();
      showToast('Berhasil!');
    } catch(err) { showToast('Gagal import!'); }
  };
  reader.readAsText(file);
}

function exportToExcel(fileName) {
  let csv = 'sep=,\nExchange,Koin,Amount,Staking,Harga USD,Total USD\n';
  allExchanges.forEach(ex => {
    watchlist.forEach(s => {
      if(coinSources[s]?.includes(ex)) {
        const d = balances[s]?.[ex];
        let am = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0);
        let st = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        if(am+st > 0) csv += `${ex},${s},${am},${st},${prices[s]||0},${((am+st)*(prices[s]||0)).toFixed(2)}\n`;
      }
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${fileName.toUpperCase().trim()}.csv`;
  a.click();
  showToast('CSV Berhasil Disimpan!');
}

function renameProcess(oldVal, newVal, type) {
  if(newVal && newVal.trim() !== '' && newVal.toUpperCase() !== oldVal) {
    const upper = newVal.toUpperCase().trim();
    if(type === 'exchange') {
      allExchanges = allExchanges.map(ex => ex === oldVal ? upper : ex);
      for(let c in coinSources) coinSources[c] = coinSources[c].map(src => src === oldVal ? upper : src);
      for(let c in balances) { if(balances[c][oldVal]) { balances[c][upper] = balances[c][oldVal]; delete balances[c][oldVal]; } }
    } else {
      watchlist = watchlist.map(s => s === oldVal ? upper : s);
      if(coinSources[oldVal]) { coinSources[upper] = coinSources[oldVal]; delete coinSources[oldVal]; }
      if(balances[oldVal]) { balances[upper] = balances[oldVal]; delete balances[oldVal]; }
    }
    saveAll(); renderList();
  }
}

// HOLD (long press) -> isian kuning jalan ke kanan, penuh = popup hapus/edit
const HOLD_MS = 600;
let noClickUntil = 0;   // blok klik nyasar habis long-press / swipe
function startHold(event, id, type) {
  if (event.type === 'mousedown' && event.button !== 0) return;   // klik kiri saja
  clearHold();
  const touch = event.touches ? event.touches[0] : event;
  startX = touch.clientX; startY = touch.clientY;
  const el = event.currentTarget;
  if (el && el.classList) {
    el.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    el.classList.add('holding');
  }
  holdTimer = setTimeout(() => {
    holdTimer = null;
    if (el && el.classList) el.classList.remove('holding');
    if (navigator.vibrate) navigator.vibrate(40);
    noClickUntil = Date.now() + 700;
    if(type === 'exchange') confirmModal(`HAPUS ${id}?`, 'delete', () => { allExchanges = allExchanges.filter(ex => ex !== id); saveAll(); renderList(); showToast(`${id} dihapus`, 'error'); }, () => renamePopup(id, 'exchange'));
    else confirmModal(`HAPUS ${id}?`, 'delete', () => { watchlist = watchlist.filter(s => s !== id); delete balances[id]; delete coinSources[id]; saveAll(); renderList(); showToast(`${id} dihapus`, 'error'); }, () => renamePopup(id, 'coin'));
  }, HOLD_MS);
}
function moveHold(event) { if(!holdTimer) return; const touch = event.touches ? event.touches[0] : event; if(Math.abs(touch.clientX-startX)>15 || Math.abs(touch.clientY-startY)>15) clearHold(); }
function clearHold() {
  clearTimeout(holdTimer); holdTimer = null;
  document.querySelectorAll('.hold-target.holding').forEach(el => el.classList.remove('holding'));
}

// ══════════════════════════════
//  SWIPE TAB (mobile): halaman ngikutin jari secara real-time.
//  Lepas jari: lewat ~30% layar / cukup kencang = pindah, kalau nggak = balik.
// ══════════════════════════════
// ── Ghost = tab tetangga yang di-render duluan (saat idle) supaya swipe langsung enteng ──
let ghostEl = null, ghostTab = null, ghostTimer = null;
function buildGhost(now) {
  const pager = document.getElementById('list-pager');
  if (!pager || !window.matchMedia('(max-width: 699px)').matches) return;
  const neighbor = currentTab === 'exchange' ? 'coin' : 'exchange';
  if (ghostEl && ghostEl.isConnected && ghostTab === neighbor) return;
  if (ghostEl) ghostEl.remove();
  const g = document.createElement('div');
  g.className = 'list-ghost'; g.style.display = 'none';
  pager.appendChild(g);
  const prev = currentTab; currentTab = neighbor;
  try { renderList(g); } finally { currentTab = prev; }
  ghostEl = g; ghostTab = neighbor;
}
function invalidateGhost() {
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  clearTimeout(ghostTimer);
  const run = () => { try { buildGhost(); } catch (e) {} };
  ghostTimer = setTimeout(() => (window.requestIdleCallback ? requestIdleCallback(run, { timeout: 2500 }) : run()), 400);
}

(function () {
  const mq = window.matchMedia('(max-width: 699px)');
  const SLIDE_MS = 280, EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
  let st = null, busy = false;

  const blocked = el => !!(el && el.closest && el.closest('input, textarea, select, .modal-overlay, .coin-search-overlay, .ex-search-overlay'));
  const overlayOpen = () => ['modal-overlay', 'coin-search-overlay'].some(id => document.getElementById(id)?.classList.contains('active'));

  function begin() {
    const pager = document.getElementById('list-pager');
    const list = document.getElementById('main-list');
    st.pager = pager; st.list = list; st.w = pager.clientWidth || window.innerWidth;
    st.sign = currentTab === 'exchange' ? 1 : -1;               // sisi tab tetangga (+1 kanan, -1 kiri)
    st.neighbor = currentTab === 'exchange' ? 'coin' : 'exchange';

    // pakai ghost yang sudah disiapkan saat idle (nggak ada render berat pas mulai geser)
    let ghost = (ghostEl && ghostEl.isConnected && ghostTab === st.neighbor) ? ghostEl : null;
    if (!ghost) { buildGhost(true); ghost = ghostEl; }
    ghost.style.left = (st.sign * 100) + '%';
    ghost.style.display = '';
    const prev = currentTab; currentTab = st.neighbor;           // segarkan angka harga di ghost
    try { updatePricesOnly(); } finally { currentTab = prev; }
    st.ghost = ghost;

    pager.style.minHeight = Math.max(list.offsetHeight, ghost.offsetHeight) + 'px';
    list.style.transition = ghost.style.transition = 'none';
    list.style.willChange = ghost.style.willChange = 'transform';
  }

  function setX(dx) {
    st.list.style.transform = `translate3d(${dx}px,0,0)`;
    st.ghost.style.transform = `translate3d(${dx}px,0,0)`;
  }

  function cleanup(committed) {
    if (!st) return;
    const { list, ghost, pager } = st;
    list.style.transition = 'none'; list.style.transform = ''; list.style.willChange = '';
    if (ghost) {
      ghost.style.transition = 'none'; ghost.style.transform = ''; ghost.style.willChange = '';
      if (committed) { ghost.remove(); if (ghostEl === ghost) ghostEl = null; }
      else ghost.style.display = 'none';                         // batal: simpan lagi buat swipe berikutnya
    }
    pager.style.minHeight = '';
    st = null; busy = false;
  }

  document.addEventListener('touchstart', e => {
    if (busy) return;
    st = null;
    if (!mq.matches || e.touches.length !== 1 || blocked(e.target) || overlayOpen()) return;
    const t = e.touches[0];
    if (t.clientX < 20 || t.clientX > window.innerWidth - 20) return;   // tepi layar = gesture back sistem
    st = { x: t.clientX, y: t.clientY, locked: null, vx: 0, lx: t.clientX, lt: performance.now(), dx: 0 };
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!st || busy || st.locked === 'v') return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = t.clientY - st.y;

    if (!st.locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.2) { st.locked = 'h'; clearHold(); begin(); }
      else { st.locked = 'v'; return; }
    }
    // kecepatan jari (px/ms)
    const now = performance.now();
    if (now - st.lt > 0) st.vx = (t.clientX - st.lx) / (now - st.lt);
    st.lx = t.clientX; st.lt = now;

    // gerak ke arah tab tetangga = ngikutin jari; arah sebaliknya = karet (ditahan)
    let x = dx;
    if (dx * st.sign > 0) x = dx * 0.2;
    else x = Math.max(-st.w, Math.min(st.w, dx));
    st.dx = x;
    setX(x);
  }, { passive: true });   // pasif: nggak nahan scroll

  function finish(cancelled) {
    if (!st || st.locked !== 'h' || busy) { if (!busy) st = null; return; }
    const { list, ghost, w, sign, neighbor } = st;
    const toward = st.dx * sign < 0;
    const fast = toward && Math.abs(st.vx) > 0.45 && (st.vx * sign < 0);
    const commit = !cancelled && toward && (Math.abs(st.dx) > w * 0.3 || fast);

    busy = true; noClickUntil = Date.now() + 400;
    const tr = `transform ${SLIDE_MS}ms ${EASE}`;
    list.style.transition = ghost.style.transition = tr;
    setX(commit ? -sign * w : 0);

    setTimeout(() => {
      if (commit) {
        skipRevealOnce = true;
        switchTab(neighbor);          // render asli, list masih di luar layar
      }
      cleanup(commit);                // langsung reset transform + buang ghost (1 frame, nggak kedip)
    }, SLIDE_MS + 20);
  }
  document.addEventListener('touchend', () => finish(false), { passive: true });
  document.addEventListener('touchcancel', () => finish(true), { passive: true });

  // habis swipe jangan ikut kebuka/ketutup item karena "klik" nyasar
  document.addEventListener('click', e => {
    if (e.isTrusted && Date.now() < noClickUntil) { e.stopPropagation(); e.preventDefault(); }   // hanya klik asli dari jari; klik dari kode (Enter) lolos
  }, true);
})();

// ══════════════════════════════
//  KEYBOARD: ENTER = eksekusi, ESC = batal (semua popup)
// ══════════════════════════════
document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  const overlay = document.getElementById('modal-overlay');
  const modalOpen = overlay && overlay.classList.contains('active');

  if (e.key === 'Escape') {
    if (modalOpen) { e.preventDefault(); closeModal(); }
    return;
  }
  if (e.key !== 'Enter' || !modalOpen) return;

  // Kalau tombol lagi fokus, biarin browser yang klik (hindari eksekusi dobel)
  if (e.target && e.target.tagName === 'BUTTON') return;

  // Login: Enter di username -> pindah ke password dulu
  const pass = document.getElementById('modal-input-pass');
  const inp = document.getElementById('modal-input');
  if (e.target === inp && pass && pass.style.display === 'block' && !pass.value) {
    e.preventDefault();
    pass.focus();
    return;
  }

  // Tombol aksi utama: HAPUS / OKE / SIMPAN / TAMBAH / EXPORT / MASUK / AMBIL
  const btn = overlay.querySelector('#modal-btns .mb-delete, #modal-btns .mb-ok');
  if (btn) {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    btn.click();
  }
}, true);
</script>
