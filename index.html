<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Portfolio Pro v2.6</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 420px; padding: 20px 15px 100px 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-size: 20px; font-weight: bold; color: var(--accent); letter-spacing: 1px; }
        .kurs-info { font-size: 10px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }

        .summary-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px; padding: 20px; margin-bottom: 25px;
            border: 1px solid var(--accent); text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .summary-label { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; display: block; }
        .summary-idr { font-size: 26px; font-weight: 800; display: block; color: #fff; }
        .summary-usd { font-size: 14px; color: var(--subtext); margin-top: 5px; display: block; }

        .coin-row { position: relative; width: 100%; margin-bottom: 12px; }
        .coin-card { 
            background: var(--card); border-radius: 12px; padding: 12px; 
            display: flex; align-items: center; gap: 10px; border: 1px solid #334155;
            cursor: pointer; position: relative; z-index: 2;
        }
        .logo-wrapper { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid #475569; flex-shrink: 0; background: #2d3748; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-group { flex: 1; min-width: 0; }
        .symbol { font-size: 14px; font-weight: bold; display: block; }
        .price-row { display: flex; align-items: center; gap: 6px; }
        .price-live { font-size: 10px; color: var(--text); font-weight: bold; }
        .change-pct { font-size: 9px; font-weight: bold; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        
        .total-display { text-align: right; margin-right: 15px; flex-shrink: 0; }
        .amount-main { font-size: 15px; font-weight: bold; display: block; color: var(--text); }
        .value-idr { font-size: 10px; color: var(--subtext); }

        .delete-btn-outside { position: absolute; right: -25px; top: 28px; transform: translateY(-50%); color: #ef4444; font-size: 24px; cursor: pointer; z-index: 1; line-height: 1; }

        .details { 
            background: #161e2e; margin: -10px 5px 5px 5px; 
            padding: 22px 15px 15px 15px; border-radius: 0 0 12px 12px; border: 1px solid #334155;
            display: none; position: relative; z-index: 1;
        }
        .source-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .source-row label { font-size: 12px; color: var(--subtext); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .source-input-wrapper { display: flex; align-items: center; gap: 8px; }
        .source-input { 
            width: 100px; background: rgba(0,0,0,0.3); border: 1px solid #475569; 
            border-radius: 6px; color: white; padding: 6px; text-align: right; font-weight: bold; outline: none;
        }
        .del-src-btn { color: #f87171; font-size: 18px; cursor: pointer; font-weight: bold; padding: 0 5px; }

        .add-source-box { display: flex; gap: 5px; margin-top: 15px; padding-top: 12px; border-top: 1px dashed #334155; }
        .add-source-box input { flex: 1; background: transparent; border: 1px dashed #475569; border-radius: 6px; color: white; padding: 6px; font-size: 11px; outline: none; }
        .btn-add-src { background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 0 12px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; outline: none; font-size: 14px; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">MY ASSETS</div>
        <div id="kurs-live" class="kurs-info">USD/IDR: Loading...</div>
    </div>

    <div class="summary-card">
        <span class="summary-label">Total Balance</span>
        <span id="total-all-idr" class="summary-idr">Rp 0</span>
        <span id="total-all-usd" class="summary-usd">$0.00</span>
    </div>

    <div id="main-list"></div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tambah koin (misal: SUI)">
            <button class="add-btn" onclick="addCoin()">+</button>
        </div>
    </div>
</div>

<script>
    let usdToIdr = parseFloat(localStorage.getItem('last_usd_idr')) || 16000;
    let prices = JSON.parse(localStorage.getItem('last_prices')) || {};
    let changes = JSON.parse(localStorage.getItem('last_changes')) || {};
    let watchlist = JSON.parse(localStorage.getItem('my_assets_v2')) || ['BTC', 'ETH'];
    let balances = JSON.parse(localStorage.getItem('my_balances_v2')) || {};
    let coinSources = JSON.parse(localStorage.getItem('my_coin_sources')) || {};
    
    let expandedCoin = null;
    const stablecoins = ['USD', 'USDT', 'USDC', 'USDE', 'USD1', 'DAI', 'BUSD'];

    // Inisialisasi awal
    window.onload = () => {
        watchlist.forEach(sym => { 
            if (!coinSources[sym]) coinSources[sym] = ['Binance', 'Bybit', 'Wallet']; 
        });
        renderList();
        fetchAll();
    };

    async function fetchAll() {
        // 1. Ambil Kurs
        try {
            const rKurs = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=usd-coin&vs_currencies=idr');
            const dKurs = await rKurs.json();
            if(dKurs['usd-coin']) {
                usdToIdr = dKurs['usd-coin'].idr;
                localStorage.setItem('last_usd_idr', usdToIdr);
            }
        } catch(e) { console.log("Kurs API Error"); }
        document.getElementById('kurs-live').innerText = `USD/IDR: ${new Intl.NumberFormat('id-ID').format(usdToIdr)}`;

        // 2. Ambil Harga Koin satu per satu
        for (let s of watchlist) {
            const sym = s.toUpperCase();
            if (stablecoins.includes(sym)) {
                prices[sym] = 1.0;
                changes[sym] = 0;
                continue;
            }
            try {
                const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${sym}USDT`);
                const d = await r.json();
                if (d.result?.list?.[0]) {
                    const data = d.result.list[0];
                    prices[sym] = parseFloat(data.lastPrice);
                    let prev = parseFloat(data.prevPrice24h);
                    if(prev && prev > 0) {
                        changes[sym] = (((prices[sym] - prev) / prev) * 100).toFixed(2);
                    } else {
                        changes[sym] = "0.00";
                    }
                }
            } catch(e) { console.log(`Error fetch ${sym}`); }
        }
        localStorage.setItem('last_prices', JSON.stringify(prices));
        localStorage.setItem('last_changes', JSON.stringify(changes));
        renderList();
    }

    function renderList() {
        const list = document.getElementById('main-list');
        if (!list) return;
        list.innerHTML = "";

        let grandTotalUsd = 0;

        watchlist.forEach(sym => {
            const symU = sym.toUpperCase();
            const total = getTotal(sym);
            const price = prices[symU] || 0;
            const change = changes[symU] || "0.00";
            const valueUsd = total * price;
            const valueIdr = valueUsd * usdToIdr;
            const isExpanded = expandedCoin === sym;

            grandTotalUsd += valueUsd;
            const sources = coinSources[sym] || ['Binance', 'Bybit', 'Wallet'];

            list.innerHTML += `
                <div class="coin-row">
                    <div class="coin-card" onclick="toggleDetail('${sym}')">
                        <div class="logo-wrapper"><img src="${getLogo(sym)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041888.png'"></div>
                        <div class="info-group">
                            <span class="symbol">${symU}</span>
                            <div class="price-row">
                                <span class="price-live">$${price ? price.toLocaleString() : '---'}</span>
                                <span class="change-pct ${parseFloat(change) >= 0 ? 'up' : 'down'}">
                                    ${parseFloat(change) >= 0 ? '+' : ''}${change}%
                                </span>
                            </div>
                        </div>
                        <div class="total-display">
                            <span id="total-${sym}" class="amount-main">${formatNumber(total)}</span>
                            <span id="idr-${sym}" class="value-idr">Rp ${Math.round(valueIdr).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    ${(symU !== 'BTC' && symU !== 'ETH') ? `<div class="delete-btn-outside" onclick="removeCoin('${sym}')">×</div>` : ''}
                    <div id="detail-${sym}" class="details" style="display: ${isExpanded ? 'block' : 'none'}">
                        ${sources.map(src => `
                            <div class="source-row">
                                <label>${src}</label>
                                <div class="source-input-wrapper">
                                    <input type="number" class="source-input" value="${balances[sym]?.[src] || ''}" 
                                        oninput="updateBalance('${sym}', '${src}', this.value)" placeholder="0">
                                    <div class="del-src-btn" onclick="removeSource('${sym}', '${src}')">×</div>
                                </div>
                            </div>
                        `).join('')}
                        <div class="add-source-box">
                            <input type="text" id="new-src-${sym}" placeholder="Nama source baru...">
                            <button class="btn-add-src" onclick="addNewSource('${sym}')">Tambah</button>
                        </div>
                    </div>
                </div>
            `;
        });

        updateGrandTotalUI(grandTotalUsd);
    }

    function getTotal(sym) {
        if (!balances[sym]) return 0;
        let sum = 0;
        const currentSources = coinSources[sym] || [];
        currentSources.forEach(src => { sum += (parseFloat(balances[sym][src]) || 0); });
        return sum;
    }

    function toggleDetail(sym) {
        expandedCoin = (expandedCoin === sym) ? null : sym;
        renderList();
    }

    function updateBalance(sym, src, val) {
        if (!balances[sym]) balances[sym] = {};
        balances[sym][src] = val;
        localStorage.setItem('my_balances_v2', JSON.stringify(balances));
        
        let grandTotalUsd = 0;
        watchlist.forEach(s => { grandTotalUsd += (getTotal(s) * (prices[s.toUpperCase()] || 0)); });
        updateGrandTotalUI(grandTotalUsd);

        const total = getTotal(sym);
        const valIdr = total * (prices[sym.toUpperCase()] || 0) * usdToIdr;
        document.getElementById(`total-${sym}`).innerText = formatNumber(total);
        document.getElementById(`idr-${sym}`).innerText = "Rp " + Math.round(valIdr).toLocaleString('id-ID');
    }

    function updateGrandTotalUI(usd) {
        const idr = usd * usdToIdr;
        document.getElementById('total-all-idr').innerText = `Rp ${Math.round(idr).toLocaleString('id-ID')}`;
        document.getElementById('total-all-usd').innerText = `$${usd.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function addNewSource(sym) {
        const input = document.getElementById(`new-src-${sym}`);
        const name = input.value.trim();
        if (name) {
            if (!coinSources[sym]) coinSources[sym] = [];
            if (!coinSources[sym].includes(name)) {
                coinSources[sym].push(name);
                localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
                renderList();
            }
        }
    }

    function removeSource(sym, src) {
        if(confirm(`Hapus source "${src}"?`)) {
            coinSources[sym] = coinSources[sym].filter(s => s !== src);
            if (balances[sym]) delete balances[sym][src];
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            renderList();
        }
    }

    function addCoin() {
        const input = document.getElementById('search-input');
        let s = input.value.toUpperCase().trim();
        if (s && !watchlist.includes(s)) {
            watchlist.push(s);
            coinSources[s] = ['Binance', 'Bybit', 'Wallet'];
            localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            input.value = "";
            fetchAll();
        }
    }

    function removeCoin(sym) {
        if(confirm(`Hapus ${sym}?`)) {
            watchlist = watchlist.filter(i => i !== sym);
            delete balances[sym];
            delete coinSources[sym];
            localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            renderList();
        }
    }

    function formatNumber(num) {
        return (!num || num === 0) ? "0" : num.toLocaleString(undefined, { maximumFractionDigits: 8 });
    }

    function getLogo(s) {
        const sym = s.toLowerCase();
        if (sym === 'btc') return 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png';
        if (sym === 'eth') return 'https://assets.coingecko.com/coins/images/279/large/ethereum.png';
        if (sym === 'usdt' || sym === 'usd') return 'https://assets.coingecko.com/coins/images/325/large/Tether.png';
        return `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${sym}.png`;
    }
</script>
</body>
</html>
