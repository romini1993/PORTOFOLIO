<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/858/858690.png">
    <title>Portofolio</title>
    
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 420px; padding: 20px 15px 100px 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-size: 20px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .brand-icon { width: 24px; height: 24px; }
        .kurs-info { font-size: 10px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }

        .summary-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px; padding: 20px; margin-bottom: 15px;
            border: 1px solid var(--accent); text-align: center;
        }
        .summary-label { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; display: block; }
        .summary-idr { font-size: 26px; font-weight: 800; display: block; color: #fff; }
        .summary-usd { font-size: 14px; color: var(--subtext); margin-top: 5px; display: block; }

        .list-filter-box { margin-bottom: 15px; }
        .list-filter-box input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #334155;
            border-radius: 10px; padding: 10px 15px; color: white; outline: none; font-size: 13px;
        }

        .controls { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 8px; }
        .sort-select { background: var(--card); color: white; border: 1px solid #334155; border-radius: 6px; font-size: 11px; padding: 4px; outline: none; }

        .coin-row { position: relative; width: 100%; margin-bottom: 12px; }
        .coin-card { 
            background: var(--card); border-radius: 12px; padding: 12px; 
            display: flex; align-items: center; gap: 10px; border: 1px solid #334155;
            cursor: pointer; position: relative; z-index: 2;
        }
        .logo-wrapper { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid #475569; flex-shrink: 0; }
        .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-group { flex: 1; min-width: 0; }
        .ticker-row { display: flex; align-items: center; gap: 6px; }
        .symbol { font-size: 14px; font-weight: bold; }
        .change-pct { font-size: 10px; font-weight: bold; }
        .price-live { font-size: 11px; color: var(--subtext); display: block; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        
        .total-display { text-align: right; margin-right: 15px; }
        .amount-main { font-size: 15px; font-weight: bold; display: block; }
        .value-idr { font-size: 10px; color: var(--subtext); }

        .delete-btn { position: absolute; right: -25px; top: 28px; transform: translateY(-50%); color: #ef4444; font-size: 24px; cursor: pointer; }

        .details { 
            background: #161e2e; margin: -10px 5px 5px 5px; 
            padding: 22px 15px 15px 15px; border-radius: 0 0 12px 12px; border: 1px solid #334155;
            display: none;
        }
        .source-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .source-input { width: 80px; background: rgba(0,0,0,0.3); border: 1px solid #475569; border-radius: 6px; color: white; padding: 5px; text-align: right; font-size: 12px; }
        .del-src { color: #f87171; font-size: 18px; margin-left: 5px; cursor: pointer; }

        .add-source-box { display: flex; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #334155; }
        .add-source-box input { flex: 1; background: transparent; border: 1px dashed #475569; border-radius: 6px; color: white; padding: 5px; font-size: 11px; }
        .btn-add-src { background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 0 10px; font-size: 11px; font-weight: bold; }

        .search-section { margin-top: 30px; border-top: 1px dashed #334155; padding-top: 20px; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; outline: none; }
        .add-btn { background: var(--accent); border: none; color: #0f172a; border-radius: 10px; padding: 0 20px; font-weight: bold; }

        .backup-section { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .backup-btn { 
            background: transparent; border: 1px solid #334155; color: var(--subtext); 
            padding: 8px 12px; border-radius: 8px; font-size: 10px; cursor: pointer; 
            display: flex; align-items: center; gap: 5px; flex: 1; min-width: 100px; justify-content: center;
        }
        .backup-btn:hover { border-color: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/858/858690.png" class="brand-icon">
            PORTOFOLIO
        </div>
        <div id="kurs-live" class="kurs-info">USD/IDR: Loading...</div>
    </div>

    <div class="summary-card">
        <br><span class="summary-label">Total Saldo</span>
        <span id="total-all-idr" class="summary-idr">Rp 0</span>
        <span id="total-all-usd" class="summary-usd">$0.00</span><br>
    </div>

    <div class="list-filter-box">
        <input type="text" id="filter-input" placeholder="Cari koin di list elu..." oninput="renderList()">
    </div>

    <div class="controls">
        <label style="font-size: 11px; color: var(--subtext);">Urutkan:</label>
        <select id="sort-order" class="sort-select" onchange="renderList()">
            <option value="manual">Default</option>
            <option value="name">Nama (A-Z)</option>
            <option value="value">Saldo Terbesar</option>
        </select>
    </div>

    <div id="main-list"></div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tambah koin baru (misal: SUI)">
            <button class="add-btn" onclick="addCoin()">+</button>
        </div>
    </div>

    <div class="backup-section">
        <button class="backup-btn" onclick="exportData()">📤 Backup JSON</button>
        <button class="backup-btn" onclick="exportToExcel()">📊 Export Excel</button>
        <button class="backup-btn" onclick="document.getElementById('importFile').click()">📥 Import JSON</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
</div>

<script>
    // --- MANIFEST VIRTUAL ---
    const manifest = {
        "name": "Portofolio",
        "short_name": "Porto",
        "start_url": window.location.href,
        "display": "standalone",
        "background_color": "#0f172a",
        "theme_color": "#0f172a",
        "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/858/858690.png", "sizes": "512x512", "type": "image/png"}]
    };
    const blobManifest = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blobManifest);
    document.querySelector('head').insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);

    // --- DATA STATE ---
    let usdToIdr = parseFloat(localStorage.getItem('last_usd_idr')) || 16000;
    let prices = JSON.parse(localStorage.getItem('last_prices') || '{}');
    let changes = JSON.parse(localStorage.getItem('last_changes') || '{}');
    let watchlist = JSON.parse(localStorage.getItem('my_assets_v2') || '["BTC", "ETH"]');
    let balances = JSON.parse(localStorage.getItem('my_balances_v2') || '{}');
    let coinSources = JSON.parse(localStorage.getItem('my_coin_sources') || '{}');
    let expandedCoin = null;
    const stablecoins = ['USD', 'USDT', 'USDC', 'USDE', 'USD1', 'DAI', 'BUSD'];

    window.onload = () => {
        watchlist.forEach(sym => { if (!coinSources[sym]) coinSources[sym] = ['Binance', 'Bybit', 'Wallet']; });
        renderList();
        fetchAll();
    };

    // --- FITUR BACKUP & EXCEL ---
    function exportData() {
        const data = { assets: watchlist, balances: balances, sources: coinSources, date: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Backup_Porto_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function exportToExcel() {
        let csv = "Koin,Source,Saldo,Harga USD,Total USD,Total IDR\n";
        watchlist.forEach(sym => {
            const price = prices[sym.toUpperCase()] || 0;
            (coinSources[sym] || []).forEach(src => {
                const saldo = parseFloat(balances[sym]?.[src]) || 0;
                if(saldo > 0) {
                    const tUsd = saldo * price;
                    csv += `${sym},${src},${saldo},${price},${tUsd.toFixed(2)},${Math.round(tUsd * usdToIdr)}\n`;
                }
            });
        });
        const blob = new Blob([csv], {type: 'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Laporan_Porto_${new Date().toLocaleDateString()}.csv`;
        a.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (data.assets && data.balances) {
                    if (confirm("Restore data dari backup?")) {
                        watchlist = data.assets; balances = data.balances; coinSources = data.sources || {};
                        localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
                        localStorage.setItem('my_balances_v2', JSON.stringify(balances));
                        localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
                        location.reload();
                    }
                }
            } catch (err) { alert("File rusak!"); }
        };
        reader.readAsText(event.target.files[0]);
    }

    // --- LOGIKA UTAMA ---
    async function fetchAll() {
        try {
            const rKurs = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=usd-coin&vs_currencies=idr');
            const dKurs = await rKurs.json();
            if(dKurs?.['usd-coin']?.idr) {
                usdToIdr = dKurs['usd-coin'].idr;
                localStorage.setItem('last_usd_idr', usdToIdr);
            }
        } catch(e) {}
        document.getElementById('kurs-live').innerText = `USD/IDR: ${new Intl.NumberFormat('id-ID').format(usdToIdr)}`;

        for (let s of watchlist) {
            const sym = s.toUpperCase();
            if (stablecoins.includes(sym)) { prices[sym] = 1.0; changes[sym] = "0.00"; continue; }
            try {
                const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${sym}USDT`);
                const d = await r.json();
                if (d.result?.list?.[0]) {
                    const data = d.result.list[0];
                    prices[sym] = parseFloat(data.lastPrice) || 0;
                    let prev = parseFloat(data.prevPrice24h);
                    changes[sym] = (prev > 0) ? (((prices[sym] - prev) / prev) * 100).toFixed(2) : "0.00";
                }
            } catch(e) {}
        }
        localStorage.setItem('last_prices', JSON.stringify(prices));
        localStorage.setItem('last_changes', JSON.stringify(changes));
        renderList();
    }

    function renderList() {
        const listContainer = document.getElementById('main-list');
        const filterVal = document.getElementById('filter-input').value.toUpperCase();
        if (!listContainer) return;
        
        const sortType = document.getElementById('sort-order').value;
        let sortedList = watchlist.filter(sym => sym.toUpperCase().includes(filterVal));

        if (sortType === 'name') sortedList.sort((a, b) => a.localeCompare(b));
        if (sortType === 'value') {
            sortedList.sort((a, b) => (getTotal(b) * (prices[b.toUpperCase()] || 0)) - (getTotal(a) * (prices[a.toUpperCase()] || 0)));
        }

        listContainer.innerHTML = "";
        let totalAllUsd = 0;

        sortedList.forEach(sym => {
            const symU = sym.toUpperCase();
            const total = getTotal(sym);
            const price = prices[symU] || 0;
            const change = changes[symU] || "0.00";
            const valUsd = total * price;
            totalAllUsd += valUsd;

            listContainer.innerHTML += `
                <div class="coin-row">
                    <div class="coin-card" onclick="toggleDetail('${sym}')">
                        <div class="logo-wrapper"><img src="${getLogo(sym)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041888.png'"></div>
                        <div class="info-group">
                            <div class="ticker-row">
                                <span class="symbol">${symU}</span>
                                <span class="change-pct ${parseFloat(change) >= 0 ? 'up' : 'down'}">${parseFloat(change) >= 0 ? '+' : ''}${change}%</span>
                            </div>
                            <span class="price-live">$${price ? price.toLocaleString() : '---'}</span>
                        </div>
                        <div class="total-display">
                            <span class="amount-main">${formatNumber(total)}</span>
                            <span class="value-idr">Rp ${Math.round(valUsd * usdToIdr).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    ${(symU !== 'BTC' && symU !== 'ETH') ? `<div class="delete-btn" onclick="removeCoin('${sym}')">×</div>` : ''}
                    <div id="detail-${sym}" class="details" style="display: ${expandedCoin === sym ? 'block' : 'none'}">
                        ${(coinSources[sym] || []).map(src => `
                            <div class="source-row">
                                <span style="font-size: 11px; color: var(--subtext)">${src}</span>
                                <div style="display:flex; align-items:center;">
                                    <input type="number" class="source-input" value="${balances[sym]?.[src] || ''}" oninput="updateBalance('${sym}', '${src}', this.value)" placeholder="0">
                                    <span class="del-src" onclick="removeSource('${sym}', '${src}')">×</span>
                                </div>
                            </div>
                        `).join('')}
                        <div class="add-source-box">
                            <input type="text" id="new-src-${sym}" placeholder="Tambah source...">
                            <button class="btn-add-src" onclick="addNewSource('${sym}')">Ok</button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        let totalReal = 0;
        watchlist.forEach(s => { totalReal += (getTotal(s) * (prices[s.toUpperCase()] || 0)); });
        updateGrandUI(totalReal);
    }

    function getTotal(sym) {
        let sum = 0;
        if (balances[sym] && coinSources[sym]) {
            coinSources[sym].forEach(src => { sum += (parseFloat(balances[sym][src]) || 0); });
        }
        return sum;
    }

    function toggleDetail(sym) { expandedCoin = (expandedCoin === sym) ? null : sym; renderList(); }

    function updateBalance(sym, src, val) {
        if (!balances[sym]) balances[sym] = {};
        balances[sym][src] = val;
        localStorage.setItem('my_balances_v2', JSON.stringify(balances));
        let totalNow = 0;
        watchlist.forEach(s => { totalNow += (getTotal(s) * (prices[s.toUpperCase()] || 0)); });
        updateGrandUI(totalNow);
    }

    function updateGrandUI(usd) {
        document.getElementById('total-all-idr').innerText = `Rp ${Math.round(usd * usdToIdr).toLocaleString('id-ID')}`;
        document.getElementById('total-all-usd').innerText = `$${usd.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function addNewSource(sym) {
        const inp = document.getElementById(`new-src-${sym}`);
        if (inp.value.trim()) {
            if (!coinSources[sym]) coinSources[sym] = [];
            coinSources[sym].push(inp.value.trim());
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            renderList();
        }
    }

    function removeSource(sym, src) {
        if(confirm(`Hapus source ${src}?`)) {
            coinSources[sym] = coinSources[sym].filter(s => s !== src);
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            renderList();
        }
    }

    function addCoin() {
        const inp = document.getElementById('search-input');
        let s = inp.value.toUpperCase().trim();
        if (s && !watchlist.includes(s)) {
            watchlist.push(s);
            localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
            inp.value = ""; fetchAll();
        }
    }

    function removeCoin(sym) {
        if(confirm(`Hapus ${sym}?`)) {
            watchlist = watchlist.filter(i => i !== sym);
            localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
            renderList();
        }
    }

    function formatNumber(n) { return (!n || n === 0) ? "0" : n.toLocaleString(undefined, { maximumFractionDigits: 8 }); }
    function getLogo(s) {
        const sym = s.toLowerCase();
        if (sym === 'btc') return 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png';
        if (sym === 'eth') return 'https://assets.coingecko.com/coins/images/279/large/ethereum.png';
        if (['usdt', 'usd'].includes(sym)) return 'https://assets.coingecko.com/coins/images/325/large/Tether.png';
        return `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${sym}.png`;
    }
</script>
</body>
</html>
