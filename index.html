<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Portfolio Bro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .crypto-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .crypto-row:last-child { border-bottom: none; }
        img { width: 32px; height: 32px; border-radius: 50%; margin-right: 12px; }
    </style>
</head>
<body class="p-6 max-w-md mx-auto">

    <div class="mb-8 text-center">
        <h1 class="text-xl font-bold mb-4">My Portfolio</h1>
        <div class="glass-card p-4">
            <input type="text" id="walletAddress" placeholder="Tempel alamat 0x... di sini" 
                   class="w-full bg-transparent border-none focus:ring-0 text-center text-sm text-gray-300" spellcheck="false">
            <button onclick="fetchBalances()" class="mt-3 w-full bg-blue-500 py-2 rounded-xl font-bold text-sm hover:bg-blue-600 transition">CEK SALDO</button>
        </div>
    </div>

    <div class="glass-card overflow-hidden">
        <div class="crypto-row">
            <div class="flex items-center">
                <img src="https://flagcdn.com/w40/id.png" alt="IDR">
                <span class="font-semibold text-gray-400">IDR</span>
            </div>
            <div id="totalIDR" class="text-lg font-bold text-green-400">Rp 0</div>
        </div>

        <div class="crypto-row">
            <div class="flex items-center">
                <img src="https://flagcdn.com/w40/us.png" alt="USD">
                <span class="font-semibold text-gray-400">USD</span>
            </div>
            <div id="totalUSD" class="text-lg font-bold text-blue-400">$ 0</div>
        </div>

        <div class="crypto-row">
            <div class="flex items-center">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="BTC">
                <span class="font-semibold text-gray-400">BTC</span>
            </div>
            <div id="totalBTC" class="text-lg font-bold">0.0000</div>
        </div>

        <div class="crypto-row">
            <div class="flex items-center">
                <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png" alt="ETH">
                <span class="font-semibold text-gray-400">ETH</span>
            </div>
            <div id="totalETH" class="text-lg font-bold">0.0000</div>
        </div>
    </div>

    <div class="mt-6 text-xs text-gray-500 text-center">
        Pokonya saldo di atas gabungan dari semua EVM chain elu.
    </div>

    <script>
        // Registrasi Service Worker buat PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        async function fetchBalances() {
            const address = document.getElementById('walletAddress').value;
            if(!address) return;

            // Simulasi data gabungan (multi-chain)
            // Ntar di sini kita ganti pake API beneran
            const btcSim = 0.045;
            const ethSim = 1.25; 
            const usdSim = 5400;
            const idrSim = usdSim * 15800;

            // Animasi angka dikit biar keren
            document.getElementById('totalIDR').innerText = "Rp " + idrSim.toLocaleString('id-ID');
            document.getElementById('totalUSD').innerText = "$ " + usdSim.toLocaleString();
            document.getElementById('totalBTC').innerText = btcSim.toFixed(4);
            document.getElementById('totalETH').innerText = ethSim.toFixed(4);
        }
    </script>
</body>
</html>
