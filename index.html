<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Portofolio Fix</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; padding: 20px 15px 100px 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-size: 20px; font-weight: bold; color: var(--accent); }
        .kurs-info { font-size: 10px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; border: 1px solid #334155; }
        .summary-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 16px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--accent); text-align: center; }
        .summary-idr { font-size: 26px; font-weight: 800; display: block; }
        .list-filter-box input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 10px; padding: 10px 15px; color: white; margin-bottom: 15px; outline: none; }
        .coin-card { background: var(--card); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #334155; margin-bottom: 10px; cursor: pointer; }
        .info-group { flex: 1; }
        .symbol { font-size: 14px; font-weight: bold; }
        .details { background: #161e2e; margin: -15px 5px 10px 5px; padding: 20px 15px 15px 15px; border-radius: 0 0 12px 12px; border: 1px solid #334155; display: none; }
        .source-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .source-input { width: 80px; background: #000; border: 1px solid #475569; color: #fff; text-align: right; border-radius: 4px; }
        .backup-section { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .backup-btn { background: transparent; border: 1px solid #334155; color: var(--subtext); padding: 10px; border-radius: 8px; font-size: 10px; cursor: pointer; text-align: center; }
        .add-btn { background: var(--accent); border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
        .search-box { display: flex; gap: 5px; margin-top: 20px; }
        .search-box input { flex: 1; background: var(--card); border: 1px solid #334155; color: white; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="brand">PORTOFOLIO</div>
        <div id="kurs-live" class="kurs-info">USD/IDR: Loading...</div>
    </div>
    <div class="summary-card">
        <span style="font-size: 11px; color: var(--accent);">TOTAL SALDO</span>
        <span id="total-all-idr" class="summary-idr">Rp 0</span>
        <span id="total-all-usd" style="color: var(--subtext);">$0.00</span>
    </div>
    <div class="list-filter-box">
        <input type="text" id="filter-input" placeholder="Cari koin di list..." oninput="renderList()">
    </div>
    <div id="main-list"></div>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Tambah koin (SUI, BTC, dll)">
        <button class="add-btn" onclick="addCoin()">+</button>
    </div>
    <div class="backup-section">
        <button class="backup-btn" onclick="exportData()">📤 Backup JSON</button>
        <button class="backup-btn" onclick="exportToExcel()">📊 Export Excel</button>
        <button class="backup-btn" onclick="document.getElementById('importFile').click()">📥 Import JSON</button>
        <button class="backup-btn" onclick="resetApp()" style="color: #f87171;">⚠️ Reset App</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
</div>

<script>
    let usdToIdr = 16000;
    let prices = {};
    let watchlist = JSON.parse(localStorage.getItem('my_assets_v2') || '["BTC", "ETH", "USDT"]');
    let balances = JSON.parse(localStorage.getItem('my_balances_v2') || '{}');
    let coinSources = JSON.parse(localStorage.getItem('my_coin_sources') || '{}');
    let expandedCoin = null;

    window.onload = () => {
        watchlist.forEach(s => { if(!coinSources[s]) coinSources[s] = ['Binance','Bybit','Wallet']; });
        renderList();
        fetchAll();
    };

    async function fetchAll() {
        try {
            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=usd-coin&vs_currencies=idr');
            const d = await r.json();
            if(d['usd-coin'].idr) usdToIdr = d['usd-coin'].idr;
            document.getElementById('kurs-live').innerText = `USD/IDR: ${usdToIdr.toLocaleString('id-ID')}`;
        } catch(e) { console.log("Gagal ambil kurs"); }

        for (let s of watchlist) {
            if (['USDT','USD','USDC'].includes(s.toUpperCase())) { prices[s.toUpperCase()] = 1; continue; }
            try {
                const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=spot&symbol=${s.toUpperCase()}USDT`);
                const d = await r.json();
                if(d.result?.list?.[0]) prices[s.toUpperCase()] = parseFloat(d.result.list[0].lastPrice);
            } catch(e) {}
        }
        renderList();
    }

    function renderList() {
        const list = document.getElementById('main-list');
        const filter = document.getElementById('filter-input').value.toUpperCase();
        list.innerHTML = "";
        let totalAllUsd = 0;

        watchlist.filter(s => s.includes(filter)).forEach(sym => {
            const price = prices[sym] || 0;
            let coinTotal = 0;
            (coinSources[sym] || []).forEach(src => coinTotal += parseFloat(balances[sym]?.[src] || 0));
            const valUsd = coinTotal * price;
            totalAllUsd += valUsd;

            list.innerHTML += `
                <div class="coin-card" onclick="toggleDetail('${sym}')">
                    <div class="info-group">
                        <span class="symbol">${sym}</span><br>
                        <span style="font-size:10px; color:var(--subtext)">$${price.toLocaleString()}</span>
                    </div>
                    <div style="text-align:right">
                        <span style="font-weight:bold">${coinTotal.toLocaleString()}</span><br>
                        <span style="font-size:10px; color:var(--subtext)">Rp ${(valUsd*usdToIdr).toLocaleString('id-ID')}</span>
                    </div>
                </div>
                <div id="det-${sym}" class="details" style="display:${expandedCoin===sym?'block':'none'}">
                    ${(coinSources[sym]||[]).map(src => `
                        <div class="source-row">
                            <span>${src}</span>
                            <input type="number" class="source-input" value="${balances[sym]?.[src]||''}" oninput="updateBal('${sym}','${src}',this.value)">
                        </div>
                    `).join('')}
                </div>`;
        });
        document.getElementById('total-all-idr').innerText = `Rp ${Math.round(totalAllUsd*usdToIdr).toLocaleString('id-ID')}`;
        document.getElementById('total-all-usd').innerText = `$${totalAllUsd.toLocaleString()}`;
    }

    function toggleDetail(s) { expandedCoin = (expandedCoin === s) ? null : s; renderList(); }
    function updateBal(s, src, v) { if(!balances[s]) balances[s]={}; balances[s][src]=v; localStorage.setItem('my_balances_v2', JSON.stringify(balances)); renderList(); }
    function addCoin() { 
        const s = document.getElementById('search-input').value.toUpperCase().trim();
        if(s && !watchlist.includes(s)) { watchlist.push(s); localStorage.setItem('my_assets_v2', JSON.stringify(watchlist)); fetchAll(); }
    }
    function exportData() {
        const data = { assets: watchlist, balances: balances, sources: coinSources };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
        a.download = "backup.json"; a.click();
    }
    function importData(e) {
        const reader = new FileReader();
        reader.onload = (f) => {
            const d = JSON.parse(f.target.result);
            watchlist = d.assets; balances = d.balances; coinSources = d.sources;
            localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
            localStorage.setItem('my_balances_v2', JSON.stringify(balances));
            localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
            location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }
    function resetApp() { if(confirm("Hapus SEMUA data?")) { localStorage.clear(); location.reload(); } }
    function exportToExcel() {
        let csv = "sep=,\nKoin,Source,Saldo,Total IDR\n";
        watchlist.forEach(s => {
            (coinSources[s]||[]).forEach(src => {
                const bal = balances[s]?.[src] || 0;
                csv += `${s},${src},${bal},${Math.round(bal*(prices[s]||0)*usdToIdr)}\n`;
            });
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = "porto.csv"; a.click();
    }
</script>
</body>
</html>
