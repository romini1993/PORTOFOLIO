<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PORTO">
  <link rel="manifest" href="manifest.json">
  <title>PORTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --card2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --bh: rgba(255,255,255,0.13);
      --text: #f0eff8;
      --muted: #6b6a80;
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.18);
      --accent-border: rgba(124,106,247,0.4);
      --green: #22d3a0;
      --red: #f05d6e;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --sidebar-w: 280px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── LAYOUT ── */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* STICKY TOP BAR — dimasukkan ke dalam summary-wrap, tidak sticky sendiri */
    .top-bar {
      background: transparent;
      padding: 10px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      flex-shrink: 0;
    }
    .brand span { color: var(--accent); }

    .kurs-badge {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    /* STICKY BLOCK UTAMA — mencakup top-bar + summary + controls */
    .summary-wrap {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(10,10,15,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 0 0 0;
    }

    .summary-card {
      background: linear-gradient(135deg, #1a1829 0%, #12111c 50%, #0e1420 100%);
      border: 1px solid var(--accent-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 30px rgba(124,106,247,0.08), inset 0 1px 0 rgba(255,255,255,0.06);
      margin: 8px 16px 0;
    }

    .summary-left { flex: 1; min-width: 0; }
    .summary-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .summary-idr {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-usd {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .summary-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .asset-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      padding: 3px 8px;
    }

    /* CONTROLS in sticky area */
    .controls-wrap {
      padding: 0 16px 10px;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .tab-row {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 8px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .filter-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus { border-color: var(--accent-border); }
    .filter-input::placeholder { color: var(--muted); }

    .sort-row {
      display: flex;
      gap: 6px;
    }
    .ctrl-select {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    /* MAIN LIST */
    #main-list {
      padding: 6px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ITEM ROW */
    .item-wrap {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      /* muncul saat masuk layar (scroll-reveal), tanpa antre dari atas */
      opacity: 0;
      transform: translateY(14px) scale(0.985);
      transition:
        opacity 0.35s ease var(--d, 0ms),
        transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) var(--d, 0ms),
        border-color 0.2s;
    }
    .item-wrap.in { opacity: 1; transform: none; }
    /* geser list saat pindah tab dengan swipe */
    #main-list.slide-from-right { animation: slideFromRight 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
    #main-list.slide-from-left  { animation: slideFromLeft  0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes slideFromRight { from { transform: translateX(36px); opacity: 0.4; } to { transform: none; opacity: 1; } }
    @keyframes slideFromLeft  { from { transform: translateX(-36px); opacity: 0.4; } to { transform: none; opacity: 1; } }
    .item-wrap.instant { opacity: 1; transform: none; transition: border-color 0.2s; }
    @media (prefers-reduced-motion: reduce) {
      .item-wrap { opacity: 1; transform: none; transition: border-color 0.2s; }
    }
    .item-wrap:hover { border-color: var(--bh); }
    .item-wrap.expanded { border-color: var(--accent-border); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    /* icon koin: inisial tampil dulu, gambar baru muncul kalau BENAR-BENAR sudah ke-load (nggak ada image rusak) */
    .logo-wrap, .stat-icon, .src-label-logo { position: relative; }
    img.coin-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden; }
    img.coin-img.ok { visibility: visible; }
    .hold-target input, .hold-target textarea { -webkit-user-select: text; user-select: text; }
    .logo-initial {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
    }

    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .change-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 5px;
    }
    .change-badge.up { color: var(--green); background: rgba(34,211,160,0.1); }
    .change-badge.down { color: var(--red); background: rgba(240,93,110,0.1); }

    .item-val {
      text-align: right;
      flex-shrink: 0;
    }
    .item-val-main {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }
    .item-val-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* EXPAND DETAIL */
    .item-detail {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
      opacity: 0;
      background: rgba(0,0,0,0.25);
      border-top: 0px solid var(--border);
    }
    .item-detail.open {
      max-height: 9999px;
      opacity: 1;
      border-top-width: 1px;
    }

    .detail-inner { padding: 10px 14px 12px; }

    /* SOURCE ROW inside detail */
    .source-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .source-row:last-of-type { border-bottom: none; }

    .src-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 80px;
      flex-shrink: 0;
    }
    .src-label-logo {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .src-label-logo img { width: 100%; height: 100%; object-fit: cover; }
    .src-label-txt {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 56px;
    }

    /* Mobile: source row jadi 2 baris - label di atas, input di bawah */
    @media (max-width: 699px) {
      .source-row {
        flex-wrap: wrap;
        gap: 5px;
      }
      .src-label {
        min-width: unset;
        flex: 1;
      }
      .src-label-txt {
        max-width: 100%;
        font-size: 11px;
      }
      .src-estimate {
        font-size: 10px;
        min-width: unset;
        flex: none;
      }
      .src-del { margin-left: auto; }
      .src-inputs {
        width: 100%;
        flex: none;
      }
      .src-input {
        flex: 1;
        width: unset;
        min-width: 0;
      }
    }

    /* Desktop: nama tidak terpotong, max-width lebih besar */
    @media (min-width: 700px) {
      .src-label-txt {
        max-width: 120px;
        font-size: 13px;
      }
      .src-label {
        min-width: 100px;
      }
      .src-inputs { gap: 8px; }
      .src-input { width: 100px; }
      .src-estimate { min-width: 75px; font-size: 11px; }
    }

    .src-inputs {
      display: flex;
      gap: 5px;
      flex: 1;
      justify-content: flex-end;
    }
    .src-input {
      width: 90px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 8px;
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      text-align: right;
      transition: border-color 0.2s;
      /* DISABLE scroll wheel change on number inputs */
      -moz-appearance: textfield;
    }
    .src-input::-webkit-inner-spin-button,
    .src-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .src-input:focus { border-color: var(--accent-border); }
    .src-input::placeholder { color: var(--muted); font-size: 11px; }

    .src-estimate {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      min-width: 60px;
      flex-shrink: 0;
    }

    .src-del {
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .src-del:hover { color: var(--red); }

    .new-src-box {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .new-src-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-family: var(--sans);
      font-size: 12px;
      outline: none;
    }
    .new-src-btn {
      background: var(--accent-glow);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-src-btn:hover { background: rgba(124,106,247,0.3); }

    /* BOTTOM BAR */
    .bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 200;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bottom-bar.bk-hidden { transform: translate3d(0, var(--bk-h, 0px), 0); }
    /* blur 20px di atas list yang lagi di-scroll itu berat banget di HP; background sudah ~opaque jadi hampir nggak beda */
    @media (max-width: 699px) {
      .summary-wrap, .bottom-bar { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .bottom-bar { background: rgba(10,10,15,0.98); }
      /* bar yang digeser ke bawah nggak boleh nambah tinggi halaman (nggak jadi area scroll kosong) */
      .main-content { overflow-y: clip; }
    }
    @media (prefers-reduced-motion: reduce) { .bottom-bar { transition-duration: .01ms; } }

    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-input:focus { border-color: var(--accent-border); }
    .add-input::placeholder { color: var(--muted); }
    .add-main-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      padding: 0 18px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .add-main-btn:active { opacity: 0.8; }

    .backup-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      opacity: 1;
      transition: opacity 0.25s ease;
    }
    /* disembunyikan lewat transform (jalur GPU), tinggi layout TETAP -> nggak ada reflow saat scroll */
    .bottom-bar.bk-hidden .backup-row { opacity: 0; }
    .bk-btn-sync-pair {
      flex: 1 1 100%;
      display: flex;
      gap: 5px;
    }
    .bk-btn-sync-pair .bk-btn-sync {
      flex: 1;
    }
    .sync-status {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      width: 100%;
      transition: color 0.3s;
      padding: 0;
      margin: -2px 0 0 0;
      min-height: 0;
      line-height: 1.2;
    }
    .sync-status:empty { display: none; }
    .sync-status.ok { color: var(--green); }
    .sync-status.err { color: var(--red); }
    .sync-status.loading { color: var(--accent); }
    .bk-btn {
      flex: 1 1 calc(50% - 2.5px);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      padding: 7px 6px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .bk-btn:hover { border-color: var(--bh); color: var(--text); }
    .bk-btn-full { flex: 1 1 100% !important; border-color: var(--accent-border) !important; color: var(--accent) !important; }
    .bk-btn-danger { color: var(--red) !important; border-color: rgba(240,93,110,0.3) !important; }
    .bk-btn-sync { color: var(--green) !important; border-color: rgba(34,211,160,0.35) !important; background: rgba(34,211,160,0.06) !important; }
    .bk-btn-sync:hover { background: rgba(34,211,160,0.14) !important; }
    .bk-btn-sync:disabled { opacity: 0.5; cursor: not-allowed; }
    .sync-status {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      min-height: 14px;
      width: 100%;
      transition: color 0.3s;
      padding: 2px 0;
    }
    .sync-status.ok { color: var(--green); }
    .sync-status.err { color: var(--red); }
    .sync-status.loading { color: var(--accent); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 340px;
      background: var(--card2);
      border: 1px solid var(--accent-border);
      border-radius: 18px;
      padding: 22px 20px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(124,106,247,0.1);
      transform: scale(0.92);
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-title {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      margin-bottom: 14px;
    }
    .modal-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
      text-align: center;
      margin-bottom: 14px;
    }
    .modal-btns {
      display: flex;
      gap: 8px;
    }
    .modal-btn {
      flex: 1;
      padding: 11px 5px;
      border: none;
      border-radius: 10px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .mb-ok { background: var(--accent); color: #fff; }
    .mb-delete { background: rgba(240,93,110,0.2); border: 1px solid rgba(240,93,110,0.4); color: var(--red); }
    .mb-edit { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); }
    .mb-cancel { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }


    /* ═══════════ ANIMASI TAHAN LAMA (isian kuning ke kanan) ═══════════ */
    :root { --g-ease: cubic-bezier(.22, 1, .36, 1); --g-spring: cubic-bezier(.34, 1.56, .64, 1); }
    .hold-target {
      position: relative;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .hold-target::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(217,164,65,0.30), rgba(217,164,65,0.08));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .25s ease;                     /* balik ke 0 saat dilepas */
      pointer-events: none;
      border-radius: inherit;
    }
    .hold-target.holding::after {
      transform: scaleX(1);
      transition: transform var(--hold-ms, 600ms) linear;  /* isi selama ditahan */
    }
    .hold-target.holding { transform: scale(0.985); transition: transform .15s ease; }
    @media (prefers-reduced-motion: reduce) { .hold-target::after { transition-duration: .01ms !important; } }

    /* ═══════════ TOAST (centang / silang digambar) ═══════════ */
    #toastHost {
      position: fixed; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      z-index: 9999;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none;
    }
    @media (max-width: 699px) { #toastHost { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); } }
    .toast-pill {
      pointer-events: auto; position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 12px;
      max-width: min(92vw, 380px);
      padding: .65rem 1.2rem .7rem .7rem;
      border-radius: 18px; color: #eef1f7;
      font-size: 14px; font-weight: 600;
      background: rgba(12,18,36,.84);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px var(--t-a), 0 0 36px -6px var(--t-a);
      cursor: pointer; opacity: 0;
      transform: translateY(48px) scale(.9);
      transition: transform .6s var(--g-spring), opacity .3s ease;
    }
    .toast-pill.is-ok  { --t: #34d399; --t-a: rgba(52,211,153,.38);  --t-bg: rgba(52,211,153,.14); }
    .toast-pill.is-err { --t: #fb7185; --t-a: rgba(251,113,133,.38); --t-bg: rgba(251,113,133,.14); }
    .toast-pill.show { opacity: 1; transform: none; }
    .toast-pill.hide { opacity: 0; transform: translateY(28px) scale(.94); transition: transform .35s ease-in, opacity .3s ease; }
    .toast-ic { position: relative; flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--t); background: var(--t-bg); }
    .toast-ic svg { width: 32px; height: 32px; overflow: visible; }
    .toast-ic::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--t); opacity: 0; }
    .tc-ring, .tc-mark { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes tDraw { to { stroke-dashoffset: 0; } }
    @keyframes tPing { 0% { transform: scale(.85); opacity: .75; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes tShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    .toast-pill.show .tc-ring { animation: tDraw .55s .12s ease forwards; }
    .toast-pill.show .tc-mark { animation: tDraw .4s .5s ease forwards; }
    .toast-pill.show .toast-ic::after { animation: tPing .9s .45s ease-out; }
    .toast-pill.is-err.show .toast-ic { animation: tShake .4s .55s ease; }
    .toast-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: var(--t); opacity: .85; transform-origin: left; }
    @keyframes tBar { to { transform: scaleX(0); } }
    .toast-pill.show .toast-bar { animation: tBar var(--dur, 2600ms) linear forwards; }
    @media (prefers-reduced-motion: reduce) {
      .toast-pill .tc-ring, .toast-pill .tc-mark, .toast-pill .toast-ic, .toast-pill .toast-ic::after, .toast-pill .toast-bar { animation: none !important; }
      .tc-ring, .tc-mark { stroke-dashoffset: 0; }
      .toast-pill { transition-duration: .01ms !important; }
    }

    /* ═══════════ PAGER LIST (swipe tab ngikutin jari) ═══════════ */
    html, body { touch-action: pan-y pinch-zoom; overscroll-behavior-x: none; }   /* scroll vertikal native & mulus; horizontal buat swipe tab */

<script>
// ══════════════════════════════
//  COIN SEARCH MODAL
// ══════════════════════════════
let cgList = [];
let coinSearchTarget = null; // { type: 'global' | 'exchange', exchange: 'BINANCE' }

function logoSrcs(sym) {
  const s = sym.toLowerCase(), S = sym.toUpperCase();
  return [
    // exchange gede dulu
    `https://bin.bnbstatic.com/static/assets/logos/${S}.png`,                  // Binance
    `https://static.okx.com/cdn/oksupport/asset/currency/icon/${s}.png`,      // OKX
    `https://gate.io/images/coin_icon/64/${s}.png`,                            // Gate (host asli, tanpa www)
    // sumber luar (semua yang dulu ada tetap dipakai)
    `https://assets.coincap.io/assets/icons/${s}@2x.png`,                      // CoinCap
    `https://coinicons-api.vercel.app/api/icon/${s}`,                          // CoinIcons
    `https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/${s}.png`,
    `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/32/color/${s}.png`
  ];                                                                           // terakhir: CoinGecko (otomatis)
}

function openCoinSearch(type, exchange) {
  coinSearchTarget = { type, exchange: exchange || null };
  const title = exchange ? `Tambah Koin ke ${exchange}` : 'Tambah Koin';
  document.getElementById('coin-search-title').innerText = title;
  document.getElementById('coin-search-input').value = '';
  document.getElementById('coin-search-overlay').classList.add('active');
  setTimeout(() => document.getElementById('coin-search-input').focus(), 150);
  cgList.length ? filterCoinSearch() : loadCGList();
}

function closeCoinSearch() {
  document.getElementById('coin-search-overlay').classList.remove('active');
  coinSearchTarget = null;
}

async function loadCGList() {
  // Cek cache dulu, kalau masih fresh (< 24 jam) pakai cache
  try {
    const cached = localStorage.getItem('cg_coin_list');
    const cachedTs = parseInt(localStorage.getItem('cg_coin_list_ts') || '0');
    if (cached && Date.now() - cachedTs < 24 * 60 * 60 * 1000) {
      cgList = JSON.parse(cached);
      cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
      filterCoinSearch();
      return;
    }
  } catch(e) {}

  document.getElementById('coin-search-results').innerHTML =
    '<div class="coin-search-loading">Memuat daftar koin...</div>';
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/list?include_platform=false');
    cgList = await r.json();
    cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
    try {
      localStorage.setItem('cg_coin_list', JSON.stringify(cgList));
      localStorage.setItem('cg_coin_list_ts', Date.now().toString());
    } catch(e) {}
    filterCoinSearch();
  } catch {
    // Kalau gagal tapi ada cache lama, tetap pakai
    try {
      const cached = localStorage.getItem('cg_coin_list');
      if (cached) {
        cgList = JSON.parse(cached);
        cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
        filterCoinSearch();
        return;
      }
    } catch(e) {}
    document.getElementById('coin-search-results').innerHTML =
      '<div class="coin-search-loading" style="color:var(--red)">Gagal memuat. Cek koneksi.</div>';
  }
}

function filterCoinSearch() {
  const q = document.getElementById('coin-search-input').value.trim().toLowerCase();
  const box = document.getElementById('coin-search-results');
  if (!cgList.length) {
    if (q) {
      const qU = q.toUpperCase();
      box.innerHTML = `<div class="coin-search-item" onclick="pickCoinFromSearch('${q}','${qU}','${q}')">
        <div class="coin-search-thumb" style="background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:bold;">+</div>
        <div>
          <div class="coin-search-name">Tambah Koin Kustom "${qU}"</div>
          <div class="coin-search-sym">${qU}</div>
        </div>
      </div>`;
    }
    return;
  }

  let hits = q
    ? cgList.filter(c => c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q))
    : cgList.slice(0, 60);

  if (q) {
    hits.sort((a, b) => {
      const rank = x => x === q ? 0 : x.startsWith(q) ? 1 : 2;
      const aR = Math.min(rank(a.symbol.toLowerCase()), rank(a.name.toLowerCase()) + 0.5);
      const bR = Math.min(rank(b.symbol.toLowerCase()), rank(b.name.toLowerCase()) + 0.5);
      return aR - bR;
    });
    hits = hits.slice(0, 60);
  }

  const targetEx = coinSearchTarget?.exchange;
  const alreadyInTarget = targetEx
    ? new Set(watchlist.filter(s => coinSources[s]?.includes(targetEx)))
    : new Set(watchlist);

  let html = hits.map(c => {
    const symU = c.symbol.toUpperCase();
    const isAdded = alreadyInTarget.has(symU);
    const src = logoSrcs(c.symbol)[0];
    const safeId   = c.id.replace(/'/g,"\\'");
    const safeName = c.name.replace(/'/g,"\\'");
    const safeSym  = c.symbol.replace(/'/g,"\\'");
    return `<div class="coin-search-item ${isAdded ? 'already' : ''}"
      onclick="${isAdded ? '' : `pickCoinFromSearch('${safeId}','${safeName}','${safeSym}')`}">
      <img class="coin-search-thumb" ${IMG_ATTR} style="visibility:hidden" data-retry="${logoCache[symU] && logoCache[symU] !== 'NONE' ? 0 : 1}"
        src="${logoCache[symU] && logoCache[symU] !== 'NONE' ? logoCache[symU] : src}"
        onload="this.style.visibility='visible'" onerror="thumbError(this,'${safeSym}')">
      <div>
        <div class="coin-search-name">${c.name}</div>
        <div class="coin-search-sym">${symU}${isAdded ? ' · sudah di exchange ini' : ''}</div>
      </div>
    </div>`;
  }).join('');

  if (q) {
    const qU = q.toUpperCase();
    const isAddedCustom = alreadyInTarget.has(qU);
    html += `<div class="coin-search-item ${isAddedCustom ? 'already' : ''}" onclick="${isAddedCustom ? '' : `pickCoinFromSearch('${q}','${qU}','${q}')`}">
      <div class="coin-search-thumb" style="background:var(--accent-border); display:flex; align-items:center; justify-content:center; color:var(--text); font-size:12px; font-weight:bold;">+</div>
      <div>
        <div class="coin-search-name">Buat Koin Kustom "${qU}"</div>
        <div class="coin-search-sym">${qU}${isAddedCustom ? ' · sudah ada' : ''}</div>
      </div>
    </div>`;
  }

  if (!hits.length && !q) {
    box.innerHTML = '<div class="coin-search-loading">Tidak ditemukan.</div>';
  } else {
    box.innerHTML = html;
  }
}

function pickCoinFromSearch(id, name, sym) {
  const symU = sym.toUpperCase();
  // Simpan target SEBELUM closeCoinSearch() karena closeCoinSearch set coinSearchTarget = null
  const target = coinSearchTarget;
  closeCoinSearch();

  if (!watchlist.includes(symU)) {
    watchlist.push(symU);
    coinSources[symU] = [];
    coinMapCG[symU] = id;
  }

  if (target?.type === 'exchange' && target.exchange) {
    const ex = target.exchange;
    if (!coinSources[symU].includes(ex)) coinSources[symU].push(ex);
    if (!allExchanges.includes(ex)) allExchanges.push(ex);
    // Pastikan exchange tetap ter-expand setelah renderList
    expandedItem = ex;
  }

  saveAll(); renderList(); fetchAll();
}

// ══════════════════════════════
//  EXCHANGE SEARCH MODAL
// ══════════════════════════════
let exSearchTarget = null; // sym koin yang mau ditambahin source-nya

function openExSearch(sym) {
  exSearchTarget = sym;
  document.getElementById('ex-search-input').value = '';
  filterExSearch();
  document.getElementById('ex-search-overlay').classList.add('active');
  setTimeout(() => document.getElementById('ex-search-input').focus(), 150);
}

function closeExSearch() {
  document.getElementById('ex-search-overlay').classList.remove('active');
  exSearchTarget = null;
}

function filterExSearch() {
  const q = document.getElementById('ex-search-input').value.trim().toUpperCase();
  const box = document.getElementById('ex-search-results');
  const sym = exSearchTarget;

  // Exchange yang sudah jadi source di koin ini
  const alreadySource = new Set(coinSources[sym] || []);

  // Filter dari allExchanges
  const matched = allExchanges.filter(ex => !alreadySource.has(ex) && (q === '' || ex.includes(q)));

  let html = matched.map(ex => {
    const brand = ex.split(' ')[0];
    const logo = exchangeLogos[brand] || '';
    return `<div class="ex-search-item" onclick="pickExFromSearch('${ex}')">
      <div class="ex-search-item-logo">
        ${logo
          ? `<img src="${logo}" onerror="this.parentElement.innerHTML='<span class=ex-search-item-logo-txt>${brand.substring(0,2)}</span>'">`
          : `<span class="ex-search-item-logo-txt">${brand.substring(0,2)}</span>`}
      </div>
      <div>
        <div class="ex-search-item-name">${ex}</div>
      </div>
    </div>`;
  }).join('');

  // Opsi buat baru kalau ada teks dan belum ada yang exact match
  if (q && !allExchanges.includes(q) && !alreadySource.has(q)) {
    html += `<div class="ex-search-item new-entry" onclick="pickExFromSearch('${q}')">
      <div class="ex-search-item-logo"><span class="ex-search-item-logo-txt">+</span></div>
      <div>
        <div class="ex-search-item-name">Buat baru: "${q}"</div>
        <div class="ex-search-item-sub">Exchange baru akan ditambahkan</div>
      </div>
    </div>`;
  }

  if (!html) {
    html = `<div style="text-align:center;padding:16px;color:var(--muted);font-family:var(--mono);font-size:11px">
      Ketik nama exchange...
    </div>`;
  }

  box.innerHTML = html;
}

function pickExFromSearch(ex) {
  const sym = exSearchTarget;
  closeExSearch();
  if (!sym) return;

  const exU = ex.toUpperCase();
  if (!allExchanges.includes(exU)) allExchanges.push(exU);
  if (!coinSources[sym]) coinSources[sym] = [];
  if (!coinSources[sym].includes(exU)) coinSources[sym].push(exU);

  saveAll(); renderList();
}


// ══════════════════════════════
//  MULTI-USER SYNC — LOGIN & CLOUD
// ══════════════════════════════
const SYNC_URL = 'https://script.google.com/macros/s/AKfycby2sWFj_-Altg7u7OcxWT-CxdMJzJhzJlOvhIK3QDt00dGUpklVrgZPXB-BZxAdmFKMjA/exec';

function getCreds() {
  const u = localStorage.getItem('porto_user');
  const p = localStorage.getItem('porto_pass');
  return (u && p) ? { username: u, password: p } : null;
}
function saveCreds(u, p) {
  localStorage.setItem('porto_user', u);
  localStorage.setItem('porto_pass', p);
}
function clearCreds() {
  localStorage.removeItem('porto_user');
  localStorage.removeItem('porto_pass');
}

function setSyncStatus(msg, type) {
  ['sync-status-desk','sync-status-mob'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerText = msg;
    el.className = 'sync-status ' + (type || '');
  });
}

// Modal login / daftar akun baru
function openAuthModal(onSuccess) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').innerText = '🔐 MASUK / DAFTAR AKUN';
  const inp = document.getElementById('modal-input');
  inp.style.display = 'block';
  inp.type = 'text';
  inp.value = '';
  inp.placeholder = 'Username...';

  let passInp = document.getElementById('modal-input-pass');
  if (!passInp) {
    passInp = document.createElement('input');
    passInp.type = 'password';
    passInp.id = 'modal-input-pass';
    passInp.className = 'modal-input';
    passInp.placeholder = 'Password...';
    inp.insertAdjacentElement('afterend', passInp);
  }
  passInp.style.display = 'block';
  passInp.value = '';

  document.getElementById('modal-btns').innerHTML = `
    <button class="modal-btn mb-ok" id="btn-login-ok">MASUK</button>
    <button class="modal-btn mb-edit" id="btn-register-ok">DAFTAR BARU</button>
    <button class="modal-btn mb-cancel" id="btn-auth-cancel">BATAL</button>`;

  function cleanup() {
    passInp.style.display = 'none';
    closeModal();
  }

  document.getElementById('btn-auth-cancel').onclick = cleanup;

  // "MASUK" — simpan kredensial lokal, verifikasi asli terjadi
  // saat push/pull (backend yang tolak kalau salah).
  document.getElementById('btn-login-ok').onclick = () => {
    const u = inp.value.trim();
    const p = passInp.value;
    if (!u || !p) { showToast('Isi username & password!'); return; }
    saveCreds(u, p);
    cleanup();
    onSuccess();
  };

  document.getElementById('btn-register-ok').onclick = async () => {
    const u = inp.value.trim();
    const p = passInp.value;
    if (!u || !p) { showToast('Isi username & password!'); return; }
    try {
      const res = await fetch(SYNC_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'register', username: u, password: p })
      });
      const json = await res.json();
      if (json.status === 'ok') {
        saveCreds(u, p);
        cleanup();
        showToast('✅ Akun dibuat! Lanjut sync...');
        onSuccess();
      } else {
        showToast('❌ ' + (json.message || 'Gagal daftar'));
      }
    } catch (err) {
      showToast('❌ Gagal daftar (koneksi)');
    }
  };

  overlay.classList.add('active');
  setTimeout(() => inp.focus(), 200);
}

function ensureAuth(next) {
  const creds = getCreds();
  if (creds) { next(); return; }
  openAuthModal(next);
}

function syncPushWithPin() { ensureAuth(syncPush); }

function syncPullWithConfirm() {
  ensureAuth(() => {
    const overlay = document.getElementById('modal-overlay');
    const inp = document.getElementById('modal-input');
    document.getElementById('modal-title').innerText = '⚠️ AMBIL DATA DARI CLOUD?';
    inp.style.display = 'none';
    document.getElementById('modal-btns').innerHTML = `
      <div style="width:100%;text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">
        Data lokal akan diganti dengan data dari cloud.<br>Pastikan data cloud sudah tersimpan dengan benar.
      </div>
      <button class="modal-btn mb-ok" id="btn-pull-ok">AMBIL</button>
      <button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
    document.getElementById('btn-pull-ok').onclick = () => { closeModal(); syncPull(); };
    overlay.classList.add('active');
  });
}

async function syncPush() {
  const creds = getCreds();
  if (!creds) return;
  setSyncStatus('⏳ Menyimpan...', 'loading');
  document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = true);
  try {
    const payload = { assets: watchlist, balances, sources: coinSources, exchanges: allExchanges };
    const res = await fetch(SYNC_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'push', username: creds.username, password: creds.password, payload })
    });
    const json = await res.json();
    if (json.status === 'ok') {
      const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'});
      setSyncStatus('✅ Tersimpan ' + t, 'ok');
      showToast('✅ Data berhasil disimpan ke cloud!');
    } else if (json.message === 'Password salah' || json.message === 'Akun tidak ditemukan') {
      clearCreds();
      setSyncStatus('❌ Login gagal', 'err');
      showToast('❌ ' + json.message + ', coba masuk lagi');
    } else throw new Error(json.message || 'Error');
  } catch (err) {
    setSyncStatus('❌ Gagal simpan', 'err');
    showToast('❌ Gagal simpan ke cloud!');
  }
  document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = false);
}

async function syncPull() {
  const creds = getCreds();
  if (!creds) return;
  setSyncStatus('⏳ Mengambil...', 'loading');
  document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = true);
  try {
    const res = await fetch(SYNC_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'pull', username: creds.username, password: creds.password })
    });
    const json = await res.json();
    if (json.status === 'ok' && json.data) {
      const d = json.data;
      watchlist   = d.assets    || [];
      balances    = d.balances  || {};
      coinSources = d.sources   || {};
      allExchanges= d.exchanges || [];
      migrateToUppercase(); saveAll(); renderList(); fetchAll();
      setSyncStatus('✅ Diperbarui ' + (json.lastUpdate || ''), 'ok');
      showToast('✅ Data berhasil diambil dari cloud!');
    } else if (json.status === 'empty') {
      setSyncStatus('⚠️ Cloud masih kosong', 'err');
      showToast('⚠️ Belum ada data di cloud. Simpan dulu!');
    } else if (json.message === 'Password salah' || json.message === 'Akun tidak ditemukan') {
      clearCreds();
      setSyncStatus('❌ Login gagal', 'err');
      showToast('❌ ' + json.message + ', coba masuk lagi');
    } else throw new Error(json.message || 'Error');
  } catch (err) {
    setSyncStatus('❌ Gagal ambil', 'err');
    showToast('❌ Gagal ambil dari cloud!');
  }
  document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = false);
}

// (Opsional) panggil logoutSync() dari tombol baru kalau mau
// kasih fitur "Ganti Akun" di device ini.
function logoutSync() {
  clearCreds();
  showToast('Akun sync di-reset di perangkat ini');
}

// ══════════════════════════════
//  MODAL
// ══════════════════════════════
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('modal-input').style.display = 'none';
  const pi = document.getElementById('modal-input-pass');
  if (pi) pi.style.display = 'none';
}

function confirmModal(msg, type, onOk, onEdit = null) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').innerText = msg;
  const inp = document.getElementById('modal-input');
  inp.style.display = 'none';
  let btns = '';
  if (type === 'delete') {
    btns = `<button class="modal-btn mb-delete" id="btn-ok">HAPUS</button>`;
    if (onEdit) btns += `<button class="modal-btn mb-edit" id="btn-edit">EDIT</button>`;
    btns += `<button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  } else {
    btns = `<button class="modal-btn mb-ok" id="btn-ok">OKE</button>`;
    btns += `<button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  }
  document.getElementById('modal-btns').innerHTML = btns;
  document.getElementById('btn-ok').onclick = () => { closeModal(); onOk(); };
  if (onEdit) document.getElementById('btn-edit').onclick = () => { closeModal(); onEdit(); };
  overlay.classList.add('active');
}

function openBackupPopup() {
  const now = new Date();

//  SCROLL — hide backup on scroll down
// ══════════════════════════════
let lastScrollY = 0;
let scrollTicking = false;
let scrollAcc = 0;                // akumulasi gerak searah (biar nggak kedip-kedip karena getaran kecil)
window.addEventListener('scroll', () => {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => {
    scrollTicking = false;
    const cur = window.scrollY;
    const bar = document.querySelector('.bottom-bar');
    const br = document.getElementById('backup-row');
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const d = cur - lastScrollY;
    lastScrollY = cur;
    if (!bar || !br) return;
    if (cur <= 0 || cur >= max - 2) { scrollAcc = 0; return; }      // ujung atas/bawah (termasuk bounce iOS): diam
    if (d === 0) return;
    if (Math.sign(d) !== Math.sign(scrollAcc)) scrollAcc = 0;
    scrollAcc += d;
    if (scrollAcc > 24 && cur > 60) {
      if (!bar.classList.contains('bk-hidden')) {
        bar.style.setProperty('--bk-h', (br.offsetHeight + 8) + 'px');   // tinggi baris backup + gap
        bar.classList.add('bk-hidden');
      }
    } else if (scrollAcc < -16) {
      bar.classList.remove('bk-hidden');
    }
  });
}, { passive: true });

let logoCache = {};
try { logoCache = JSON.parse(localStorage.getItem('coin_logo_cache_v1') || '{}'); } catch(e) { logoCache = {}; }
// Status "NONE" = koin yang dianggap nggak punya icon. Kadaluarsa otomatis (key __t_ = waktu kadaluarsa).
(function () {
  let dirty = false;
  const now = Date.now();
  // sekali jalan: buang semua NONE yang kebentuk oleh versi sebelumnya (sumber icon-nya dulu belum lengkap)
  if (!localStorage.getItem('logo_none_purged_v2')) {
    Object.keys(logoCache).forEach(k => { if (logoCache[k] === 'NONE' || k.startsWith('__t_')) { delete logoCache[k]; } });
    try { localStorage.setItem('logo_none_purged_v2', '1'); } catch(e) {}
    dirty = true;
  }
  Object.keys(logoCache).forEach(k => {
    if (k.startsWith('__t_')) return;
    if (logoCache[k] === 'NONE') {
      const t = logoCache['__t_' + k];
      if (!t || now > t) { delete logoCache[k]; delete logoCache['__t_' + k]; dirty = true; }
    }
  });
  if (dirty) { try { localStorage.setItem('coin_logo_cache_v1', JSON.stringify(logoCache)); } catch(e) {} }
})();

function saveLogoCache() {
  try { localStorage.setItem('coin_logo_cache_v1', JSON.stringify(logoCache)); } catch(e) {}
}

function cacheLogo(sym, src) {
  if (!src || !sym) return;
  if (logoCache[sym] === src) return;
  logoCache[sym] = src;
  saveLogoCache();
}

// Bikin markup icon koin. Kalau sudah pernah ketemu logo yang jalan (atau
// sudah dipastikan tidak ada logonya), langsung pakai hasil cache itu -
// jadi ganti tab / re-render TIDAK perlu ulang proses coba-coba (no more kedip).
const IMG_ATTR = 'alt="" referrerpolicy="no-referrer" decoding="async"';

function coinIconHtml(sym) {
  if (sym === 'IDR') return `<div class="logo-initial" style="color:#22d3a0">RP</div>`;
  const ini = sym.substring(0, 2);
  const cached = logoCache[sym];
  if (cached === 'NONE') return `<div class="logo-initial">${ini}</div>`;
  if (cached) {
    // url yang sudah pernah jalan: langsung tampil (kalau suatu saat rusak, otomatis dicoba sumber lain)
    return `<img class="coin-img ok" ${IMG_ATTR} src="${cached}" data-retry="0" onerror="handleLogoError(this,'${sym}')" onload="logoLoaded(this,'${sym}')">`;
  }
  // belum pernah: inisial dulu, gambar nyusul begitu ketemu
  const first = logoSrcs(sym)[0];
  return `<span class="logo-initial logo-ph">${ini}</span><img class="coin-img" ${IMG_ATTR} src="${first}" data-retry="1" onerror="handleLogoError(this,'${sym}')" onload="logoLoaded(this,'${sym}')">`;
}

function logoLoaded(img, sym) {
  // gambar 1x1 / kosong dianggap gagal
  if (img.naturalWidth && img.naturalWidth < 4) { handleLogoError(img, sym); return; }
  img.classList.add('ok');
  const ph = img.previousElementSibling;
  if (ph && ph.classList.contains('logo-ph')) ph.remove();
  cacheLogo(sym, img.currentSrc || img.src);
}

const logoCG = {};          // SYMBOL -> url gambar dari CoinGecko
const logoCGPending = {};   // biar nggak request dobel

let cgQueue = Promise.resolve();
const sleepMs = ms => new Promise(r => setTimeout(r, ms));

function logoFromCG(sym) {
  if (logoCG[sym]) return Promise.resolve({ url: logoCG[sym] });
  if (!logoCGPending[sym]) {
    const job = cgQueue.then(async () => {
      try {
        const d = await fetchJSON(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&symbols=${sym.toLowerCase()}`, 8000);
        const hit = d.filter(c => c.image && c.symbol.toUpperCase() === sym)
                     .sort((x, y) => (x.market_cap_rank || 1e9) - (y.market_cap_rank || 1e9))[0];
        if (hit) { logoCG[sym] = hit.image; return { url: hit.image }; }
        return { url: null, transient: false };      // beneran nggak ada
      } catch (e) {
        return { url: null, transient: true };       // error / rate-limit: jangan di-cache lama
      }
    });
    cgQueue = job.then(() => sleepMs(1100), () => sleepMs(1100));   // antre, jeda antar request
    logoCGPending[sym] = job;
  }
  return logoCGPending[sym];
}

function logoGiveUp(img, sym, transient) {
  logoCache[sym] = 'NONE';
  logoCache['__t_' + sym] = Date.now() + (transient ? 10 * 60 * 1000 : 3 * 86400000);   // kadaluarsa -> dicoba lagi
  saveLogoCache();
  if (img.parentElement) img.parentElement.innerHTML = `<div class="logo-initial">${sym.substring(0,2)}</div>`;
}

function thumbError(img, sym) {
  const retry = parseInt(img.getAttribute('data-retry') || '0');
  const sources = logoSrcs(sym);
  if (retry < sources.length) { img.setAttribute('data-retry', retry + 1); img.src = sources[retry]; return; }
  img.outerHTML = `<div class="coin-search-thumb" style="display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--accent);font:700 10px var(--mono)">${sym.substring(0,2).toUpperCase()}</div>`;
}

function handleLogoError(img, sym) {
  if (sym === 'IDR') { img.parentElement.innerHTML = `<div class="logo-initial" style="color:#22d3a0">RP</div>`; return; }
  // sembunyikan gambar rusak + pastikan inisial tampil selama nyari sumber lain
  img.classList.remove('ok');
  const prev = img.previousElementSibling;
  if (!(prev && prev.classList.contains('logo-ph'))) img.insertAdjacentHTML('beforebegin', `<span class="logo-initial logo-ph">${sym.substring(0,2)}</span>`);

  const retry = parseInt(img.getAttribute('data-retry') || '0');
  const sources = logoSrcs(sym);
  if (retry < sources.length) { img.setAttribute('data-retry', retry + 1); img.src = sources[retry]; return; }
  // semua sumber exchange/luar gagal -> coba gambar dari CoinGecko (1x, antre, di-cache)
  if (retry === sources.length) {
    img.setAttribute('data-retry', retry + 1);
    logoFromCG(sym).then(r => { if (r.url) img.src = r.url; else logoGiveUp(img, sym, r.transient); });
    return;
  }
  logoGiveUp(img, sym);
}

function migrateToUppercase() {
  let dirty = false;
  watchlist = watchlist.map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  allExchanges = allExchanges.map(ex => { if(ex !== ex.toUpperCase()) dirty = true; return ex.toUpperCase(); });
  let newCS = {}, newBal = {};
  for (let c in coinSources) {
    let uc = c.toUpperCase(); if(c !== uc) dirty = true;
    newCS[uc] = (coinSources[c] || []).map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  }
  for (let c in balances) {
    let uc = c.toUpperCase(); newBal[uc] = {};
    for (let s in balances[c]) {
      let us = s.toUpperCase();
      newBal[uc][us] = (typeof balances[c][s] === 'object') ? balances[c][s] : { amount: balances[c][s], staking: '' };
    }
  }
  coinSources = newCS; balances = newBal;
  if(dirty) saveAll();
}

async function fetchCoinMap() {
  // Cek cache dulu, kalau masih fresh (< 24 jam) pakai cache
  try {
    const cached = localStorage.getItem('cg_coin_map');
    const cachedTs = parseInt(localStorage.getItem('cg_coin_map_ts') || '0');
    if (cached && Date.now() - cachedTs < 24 * 60 * 60 * 1000) {
      Object.assign(coinMapCG, JSON.parse(cached));
      return;
    }
  } catch(e) {}
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/list');
    const list = await r.json();
    list.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
    try {
      const mapToSave = {};
      list.forEach(c => { mapToSave[c.symbol.toUpperCase()] = c.id; });
      localStorage.setItem('cg_coin_map', JSON.stringify(mapToSave));
      localStorage.setItem('cg_coin_map_ts', Date.now().toString());
    } catch(e) {}
  } catch(e) {
    // Gagal fetch, pakai cache lama walau expired
    try {
      const cached = localStorage.getItem('cg_coin_map');
      if (cached) Object.assign(coinMapCG, JSON.parse(cached));
    } catch(e2) {}
  }
}

// Fetch dengan timeout biar satu exchange lemot nggak nahan yang lain
async function fetchJSON(url, ms = 7000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// Catatan "koin X nggak ada di exchange Y" (berlaku 30 menit) -> exchange itu nggak di-download lagi tiap refresh
const priceMiss = {};
async function pullSource(src, wantSyms) {
  const miss = priceMiss[src.name] || (priceMiss[src.name] = {});
  const now = Date.now();
  const need = wantSyms.filter(sym => !(miss[sym] > now));
  if (!need.length) return null;                      // semua sudah pasti nggak ada di sini: skip download
  try {
    const map = await src.load(new Set(need));
    need.forEach(sym => { if (!map[sym]) miss[sym] = now + 30 * 60000; });
    return map;
  } catch (e) { return null; }                        // error jaringan: jangan dicatat sebagai "nggak ada"
}

let lastFetchAt = 0;
async function fetchAll() {
  if (isFetching) return; isFetching = true;
  try {
    const STABLE = ['IDR','USDT','USDC','USD','BUSD'];
    let rem = watchlist.filter(s => !STABLE.includes(s));

    const apply = map => {
      rem = rem.filter(sym => {
        const x = map[sym];
        if (x && isFinite(x.p) && x.p > 0) { prices[sym] = x.p; changes[sym] = (isFinite(x.c) ? x.c : 0).toFixed(2); return false; }
        return true;
      });
    };

    // 1) Exchange top, URUT sesuai prioritas & berhenti begitu semua koin ketemu
    //    (biasanya cukup 1 download, nggak 7 sekaligus). Binance > Bybit > OKX > Bitget > MEXC > KuCoin > Gate
    for (const src of PRICE_SOURCES) {
      if (!rem.length) break;
      const map = await pullSource(src, rem);
      if (map) { apply(map); updatePricesOnly(); }
      await new Promise(r => setTimeout(r, 0));       // kasih napas ke UI antar exchange
    }

    // 1b) Tokocrypto: nggak ada endpoint semua-ticker, jadi dicek per koin (hanya sisa yang belum ketemu)
    if (rem.length > 0 && rem.length <= 25) {
      const toko = await Promise.allSettled(rem.map(async sym => {
        const d = await fetchJSON(`https://www.tokocrypto.com/open/v1/market/trades?symbol=${sym}_USDT&limit=1`, 5000);
        const row = (d.data?.list || d.data || [])[0];
        const p = row ? +row.price : 0;
        return p > 0 ? { sym, p } : null;
      }));
      const got = {};
      toko.forEach(r => { if (r.status === 'fulfilled' && r.value) got[r.value.sym] = r.value.p; });
      rem = rem.filter(sym => {
        if (got[sym]) { prices[sym] = got[sym]; if (changes[sym] == null) changes[sym] = '0.00'; return false; }
        return true;
      });
    }

    // 2) Fallback CoinGecko /coins/markets by symbol (pilih market cap terbesar)
    if (rem.length > 0) {
      try {
        const d = await fetchJSON(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&symbols=${rem.map(x => x.toLowerCase()).join(',')}&price_change_percentage=24h`, 10000);
        const best = {};
        d.forEach(c => {
          const S = c.symbol.toUpperCase();
          const rank = c.market_cap_rank || 1e9;
          if (!best[S] || rank < best[S].rank) best[S] = { rank, c };
          if (c.image) logoCG[S] = logoCG[S] || c.image;
        });
        rem = rem.filter(sym => {
          const b = best[sym];
          if (b && b.c.current_price) { prices[sym] = b.c.current_price; changes[sym] = (b.c.price_change_percentage_24h ?? 0).toFixed(2); return false; }
          return true;
        });
      } catch(e) {}
    }

    // 3) Fallback terakhir: lewat CoinGecko id map (cara lama)
    if (rem.length > 0) {
      const cgIds = rem.filter(s => coinMapCG[s]).map(s => coinMapCG[s]);
      if (cgIds.length > 0) {
        try {
          const d = await fetchJSON(`https://api.coingecko.com/api/v3/simple/price?ids=${cgIds.join(',')}&vs_currencies=usd&include_24hr_change=true`, 10000);
          rem = rem.filter(s => {
            const id = coinMapCG[s];
            if (id && d[id]) { prices[s] = d[id].usd; changes[s] = d[id].usd_24h_change ? d[id].usd_24h_change.toFixed(2) : '0.00'; return false; }
            return true;
          });
        } catch(e) {}
      }
    }

    watchlist.forEach(s => {
      if(s === 'IDR') { prices[s] = 1/usdToIdr; changes[s] = '0.00'; }
      else if(STABLE.includes(s)) { prices[s] = 1; changes[s] = '0.00'; }
      else if(!prices[s]) { prices[s] = 0; changes[s] = '0.00'; }
    });
    updatePricesOnly();
  } finally {
    lastFetchAt = Date.now();
    isFetching = false;                               // selalu dilepas, walau ada error
  }
}

function getSortType() {
  const isDesktop = window.innerWidth >= 700;
  return document.getElementById(isDesktop ? 'sort-order-desk' : 'sort-order')?.value || 'manual';
}
function getCurrencyView() {
  const isDesktop = window.innerWidth >= 700;
  return document.getElementById(isDesktop ? 'currency-view-desk' : 'currency-view')?.value || 'IDR';
}
function getFilterQuery() {
  const isDesktop = window.innerWidth >= 700;
  return (document.getElementById(isDesktop ? 'filter-desk' : 'filter-input')?.value || '').toUpperCase();
}

function getCoinTotal(sym) {
  let t = 0;
  (coinSources[sym] || []).forEach(src => {
    const d = balances[sym]?.[src];
    t += (typeof d === 'object') ? (parseFloat(d.amount||0) + parseFloat(d.staking||0)) : parseFloat(d||0);
  });
  return t;
}

function fmtUSD(v) {
  if(v >= 1000000) return `$${(v/1000000).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}M`;
  if(v >= 1000) return `$${v.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  return `$${v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

function fmtIDR(v) {
  return `Rp ${Math.round(v).toLocaleString('id-ID')}`;
}

function saveAll() {
  localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
  localStorage.setItem('my_balances_v2', JSON.stringify(balances));
  localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
  localStorage.setItem('my_exchanges_v2', JSON.stringify(allExchanges));
}

const TOAST_ICONS = {
  ok:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="tc-ring" cx="12" cy="12" r="9.5" pathLength="1"/><path class="tc-mark" d="M7.8 12.4l2.9 2.9 5.6-6" pathLength="1"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="tc-ring" cx="12" cy="12" r="9.5" pathLength="1"/><path class="tc-mark" d="M9 9l6 6M15 9l-6 6" pathLength="1"/></svg>'
};

// showToast('teks')                -> tipe ditebak dari teks (gagal / sudah ada / isi... = silang)
// showToast('teks', 'success'|'error')
function showToast(message, type) {
  message = String(message);
  if (!type) type = /^❌|gagal|sudah ada|^isi /i.test(message) ? 'error' : 'success';
  message = message.replace(/^[✅❌]\s*/, '');
  const ok = type === 'success';

  let host = document.getElementById('toastHost');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toastHost';
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  while (host.children.length >= 3) host.firstElementChild.remove();

  const DUR = 2600;
  const el = document.createElement('div');
  el.className = 'toast-pill ' + (ok ? 'is-ok' : 'is-err');
  el.setAttribute('role', ok ? 'status' : 'alert');
  el.style.setProperty('--dur', DUR + 'ms');
  el.innerHTML = `<span class="toast-ic">${ok ? TOAST_ICONS.ok : TOAST_ICONS.err}</span><span class="toast-msg"></span><span class="toast-bar"></span>`;
  el.querySelector('.toast-msg').textContent = message;
  host.appendChild(el);

  let timer = null;
  const dismiss = () => {
    clearTimeout(timer);
    if (!el.isConnected || el.classList.contains('hide')) return;
    el.classList.remove('show'); el.classList.add('hide');
    setTimeout(() => el.remove(), 380);
  };
  el.addEventListener('click', dismiss);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  timer = setTimeout(dismiss, DUR);
}

// ══════════════════════════════
//  UPDATE PRICES (no re-render)
// ══════════════════════════════
function updatePricesOnly() {
  const cur = getCurrencyView();
  let totalUsd = 0;

  if(currentTab === 'exchange') {
    allExchanges.forEach(ex => {
      let exUsd = 0;
      watchlist.forEach(sym => {
        if(coinSources[sym]?.includes(ex)) {
          const d = balances[sym]?.[ex];
          let b = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
          exUsd += b * (prices[sym]||0);
        }
      });
      totalUsd += exUsd;
      const el = document.getElementById(`val-ex-${ex}`);
      if(el) el.innerText = cur === 'IDR' ? fmtIDR(exUsd*usdToIdr) : fmtUSD(exUsd);

      // update per-coin estimates inside expand
      watchlist.forEach(sym => {
        if(coinSources[sym]?.includes(ex)) {
          const est = document.getElementById(`est-${ex}-${sym}`);
          if(est) {
            const d = balances[sym]?.[ex];
            const amt = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
            const usdVal = amt * (prices[sym]||0);
            est.innerText = amt > 0 ? `~${fmtUSD(usdVal)}` : '';
          }
        }
      });
    });
  } else {
    watchlist.forEach(sym => {
      const valUsd = getCoinTotal(sym) * (prices[sym]||0);
      totalUsd += valUsd;
      const elVal = document.getElementById(`val-coin-${sym}`);
      const elPrice = document.getElementById(`price-coin-${sym}`);
      const elChange = document.getElementById(`change-coin-${sym}`);
      if(elVal) elVal.innerText = cur === 'IDR' ? fmtIDR(valUsd*usdToIdr) : fmtUSD(valUsd);
      if(elPrice) elPrice.innerText = sym === 'IDR' ? 'Stable IDR' : '$'+(prices[sym]||0).toLocaleString(undefined,{minimumFractionDigits:(prices[sym]||0)<1?4:2});
      if(elChange) {
        const c = changes[sym] || '0.00';
        elChange.innerText = `${parseFloat(c)>=0?'+':''}${c}%`;
        elChange.className = `change-badge ${parseFloat(c)>=0?'up':'down'}`;
      }
      // per-source estimates in coin tab
      (coinSources[sym]||[]).forEach(src => {
        const est = document.getElementById(`est-coin-${sym}-${src}`);
        if(est) {
          const d = balances[sym]?.[src];
          const amt = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
          const usdVal = amt * (prices[sym]||0);
          est.innerText = amt > 0 ? `~${fmtUSD(usdVal)}` : '';
        }
      });
    });
  }

  const idrTotal = fmtIDR(totalUsd * usdToIdr);
  const usdTotal = fmtUSD(totalUsd);
  // Slot besar (id -idr / -desk) & slot kecil (id -usd) tuker isi sesuai currency yang lagi dipilih
  const primaryTotal = cur === 'USD' ? usdTotal : idrTotal;
  const secondaryTotal = cur === 'USD' ? idrTotal : usdTotal;
  ['total-all-idr','total-idr-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = primaryTotal; });
  ['total-all-usd','total-usd-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = secondaryTotal; });

  // asset count badge
  const cnt = currentTab === 'exchange' ? allExchanges.length : watchlist.length;
  const label = currentTab === 'exchange' ? 'exchange' : 'aset';
  ['asset-count-badge', 'asset-count-badge-desk'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerText = `${cnt} ${label}`;
  });

  // stat boxes desktop — 3 top gainers dengan icon + harga + persentase
  const gainersEl = document.getElementById('sidebar-top-gainers');
  if (gainersEl) {
    const ranked = watchlist
      .filter(s => changes[s] !== undefined)
      .map(s => ({ sym: s, chg: parseFloat(changes[s] || 0), price: prices[s] || 0 }))
      .sort((a, b) => b.chg - a.chg)
      .slice(0, 3);

    const fmtPrice = (p) => p >= 1000 ? `$${Math.round(p).toLocaleString()}` : p >= 1 ? `$${p.toFixed(2)}` : `$${p.toFixed(4)}`;

    gainersEl.innerHTML = ranked.length ? ranked.map(g => {
      return `<div class="stat-box">
        <div class="stat-top-row">
          <div class="stat-icon">${coinIconHtml(g.sym)}</div>
          <span class="stat-sym">${g.sym}</span>
        </div>
        <div class="stat-price">${fmtPrice(g.price)}</div>
        <div class="stat-chg ${g.chg >= 0 ? 'green' : 'red'}">${g.chg >= 0 ? '+' : ''}${g.chg.toFixed(2)}%</div>
      </div>`;
    }).join('') :
    `<div class="stat-box"><div class="stat-sym">-</div><div class="stat-price">-</div><div class="stat-chg">-</div></div>
     <div class="stat-box"><div class="stat-sym">-</div><div class="stat-price">-</div><div class="stat-chg">-</div></div>
     <div class="stat-box"><div class="stat-sym">-</div><div class="stat-price">-</div><div class="stat-chg">-</div></div>`;
  }
}

function toggleDetail(id) {
  const target = document.getElementById(`det-${id}`);
  if(!target) return;

  // close previous
  if(expandedItem && expandedItem !== id) {
    const old = document.getElementById(`det-${expandedItem}`);
    if(old) { old.classList.remove('open'); document.getElementById(`wrap-${expandedItem}`)?.classList.remove('expanded'); }
  }

  const wrap = document.getElementById(`wrap-${id}`);
  if(target.classList.contains('open')) {
    target.classList.remove('open');
    wrap?.classList.remove('expanded');
    expandedItem = null;
  } else {
    target.classList.add('open');
    wrap?.classList.add('expanded');
    expandedItem = id;
    // update estimates right away
    setTimeout(updatePricesOnly, 50);
  }
}

// ══════════════════════════════
//  RENDER LIST
// ══════════════════════════════
// ══════════════════════════════
//  SCROLL-REVEAL: item muncul bareng begitu masuk layar
// ══════════════════════════════
let revealIO = null;
const revealedIds = new Set();

let skipRevealOnce = false;
function revealItems(list) {
  if (revealIO) revealIO.disconnect();
  const els = list.querySelectorAll('.item-wrap');
  if (skipRevealOnce) { skipRevealOnce = false; els.forEach(el => { el.classList.add('instant'); revealedIds.add(el.id); }); return; }
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Browser lama / reduced-motion: tampilkan semua langsung
  if (!('IntersectionObserver' in window) || reduce) {
    els.forEach(el => el.classList.add('instant'));
    return;
  }

  revealIO = new IntersectionObserver(entries => {
    // Semua item yang terlihat di batch ini muncul hampir bersamaan
    // (stagger tipis, maks ~240ms), nggak peduli posisinya di list.
    const vis = entries.filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    vis.forEach((e, i) => {
      e.target.style.setProperty('--d', Math.min(i, 6) * 40 + 'ms');
      e.target.classList.add('in');
      revealedIds.add(e.target.id);
      revealIO.unobserve(e.target);
    });
  }, { threshold: 0.05, rootMargin: '60px 0px 60px 0px' });

  els.forEach(el => {
    if (revealedIds.has(el.id)) el.classList.add('instant'); // sudah pernah muncul: jangan animasi ulang saat re-render/filter
    else revealIO.observe(el);
  });
}
